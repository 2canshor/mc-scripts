<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Event Centre">
<meta name="robots" content="noindex">
<title>Event Centre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
:root{
  --ga:#933D36;--gb:#106E32;--gc:#367CBA;--gd:#8B5492; /* tell-ok: small-group colours A-D */
  --canvas:#FBFAF7;--current:#F1EFE8;--field:#EDEBE3;--fill:#6E5916;--primary:#BAA877;--on-primary:#1A1A18; /* tell-ok: CA Design System tokens */
  --primary-glass:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.06) 55%,rgba(255,255,255,0)),color-mix(in srgb,var(--primary) 88%,transparent); /* tell-ok: tinted glass for the one primary button */
  --text:#1A1A18;--secondary:#6B6A64;--caption:#85837C;--present:#4E9F62;--danger:#9A3B2E;--on-color:#FFFFFF; /* tell-ok: CA Design System tokens */
  --glass:rgba(255,255,255,.66);--glass-hi:rgba(255,255,255,.94);
  --glass-shadow:0 1px 1px rgba(26,26,24,.04),0 8px 28px rgba(26,26,24,.12);
  --dim:rgba(26,26,24,.32);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
  --side:max(36px,calc((100vw - 760px) / 2));
  --tc:3.6em;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--ga:#F39D92;--gb:#64C67B;--gc:#91B9E4;--gd:#D3A5D9;
  --canvas:#1C1C1A;--current:#262623;--field:#2E2D2A;--fill:#BAA877;--text:#F2F0EA;--secondary:#B0AEA5;--caption:#8E8D87;--present:#7CCB8F;--danger:#E59A8C;--on-color:#1C1C1A; /* tell-ok: CA Design System tokens (dark) */
  --glass:rgba(44,44,41,.66);--glass-hi:rgba(58,58,54,.97);--glass-shadow:0 1px 1px rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.45);--dim:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{color-scheme:dark;--ga:#F39D92;--gb:#64C67B;--gc:#91B9E4;--gd:#D3A5D9;
  --canvas:#1C1C1A;--current:#262623;--field:#2E2D2A;--fill:#BAA877;--text:#F2F0EA;--secondary:#B0AEA5;--caption:#8E8D87;--present:#7CCB8F;--danger:#E59A8C;--on-color:#1C1C1A; /* tell-ok: CA Design System tokens (dark) */
  --glass:rgba(44,44,41,.66);--glass-hi:rgba(58,58,54,.97);--glass-shadow:0 1px 1px rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.45);--dim:rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{background:var(--canvas)}
html{-webkit-text-size-adjust:100%}
*{touch-action:manipulation}  /* no double-tap zoom anywhere (pinching is stopped in the script); pan-x pan-y on the page left taps without a click on iOS */
body{margin:0;color:var(--text);font-family:var(--serif);font-size:17px;line-height:1.5;padding-inline:36px;-webkit-text-size-adjust:100%}
/* Only words take the selection colour (26/10/09). Safari paints the space between and beside selected blocks too,
   so the layout is unselectable and the elements that hold words opt back in; symbols and photos stay out. */
body{-webkit-user-select:none;user-select:none}
h1,h2,h3,p,span,a,label,li,td,th,b,strong,em,small,time,.srow .body,input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
svg,img,.av{-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round} /* stroke-ok: line icons */

/* ---------- Control layer: glass controls float over the content; content fades under them ---------- */
.ctl{position:fixed;z-index:6;top:calc(16px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center}
.ctl.l{left:calc(var(--side) + env(safe-area-inset-left,0px))}
.ctl.r{right:calc(var(--side) + env(safe-area-inset-right,0px))}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:var(--glass-shadow)}
.nb{height:44px;min-width:44px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;white-space:nowrap}
.nb.round{width:44px;padding:0}
.nb.round svg.i{width:22px;height:22px;stroke-width:2} /* stroke-ok: line icons */
.nb.av{width:52px;height:52px;font-weight:600;font-size:22px;overflow:hidden}
.nb.av img{width:100%;height:100%;object-fit:cover}
.nb.pri{background:var(--primary-glass);color:var(--on-primary);font-weight:600;box-shadow:var(--glass-shadow)}
.nb:disabled{opacity:.4;cursor:default}
.grp{display:flex;border-radius:999px}
.grp .nb{padding:0 12px}
.nb.danger,.danger{color:var(--danger)}
@media (hover:hover){.nb.glass:hover,.grp .nb:hover{background:var(--glass-hi)}}
.edge{position:fixed;z-index:5;left:0;right:0;top:0;height:calc(92px + env(safe-area-inset-top,0px));pointer-events:none;background:linear-gradient(to bottom,var(--canvas) 66%,color-mix(in srgb,var(--canvas) 0%,transparent));opacity:0;transition:opacity .15s} /* tell-ok: iOS scroll edge effect */
.scrolled .edge{opacity:1}
.bt{position:fixed;z-index:6;top:calc(16px + env(safe-area-inset-top,0px));left:calc(var(--side) + 120px);right:calc(var(--side) + 120px);height:44px;line-height:44px;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s;pointer-events:none}
.titled .bt{opacity:1}
/* Search: a glass bar at the bottom of the Events list, as in MC Scripts */
.search{position:fixed;z-index:6;left:calc(var(--side) + env(safe-area-inset-left,0px));right:calc(var(--side) + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));height:52px;display:flex;align-items:center;gap:10px;padding:0 18px;border-radius:999px;cursor:text}
.search.withfab{right:calc(var(--side) + 56px + 12px + env(safe-area-inset-right,0px))}
.fab{position:fixed;z-index:6;right:calc(var(--side) + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:999px;display:grid;place-items:center;background:var(--primary-glass);color:var(--on-primary);box-shadow:var(--glass-shadow)}
.fab svg.i{width:26px;height:26px;stroke-width:2} /* stroke-ok: line icons */
.search svg.i{color:var(--secondary)}
.search input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:none;padding:0;font-size:17px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--secondary)}
.edge.b{top:auto;bottom:0;height:calc(84px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--canvas) 40%,color-mix(in srgb,var(--canvas) 0%,transparent));opacity:1} /* tell-ok: scroll edge fade above the search bar */

/* ---------- Content layer: one leading edge for title, headers and row text ---------- */
.page{max-width:760px;margin:0 auto;padding:84px 0 120px}
.page.root{padding-top:calc(16px + env(safe-area-inset-top,0px))}
h1{font-size:31px;font-weight:600;line-height:1.25;margin:0;word-break:normal;line-break:strict;text-wrap:pretty}
.root h1{min-height:52px;display:flex;align-items:center;padding-right:64px}
h1 .sep,.sep{color:var(--secondary);font-weight:400}
.evn{display:inline-block;max-width:100%;vertical-align:top;text-wrap:balance}
.nw{white-space:nowrap}
.sub{margin:6px 0 0;color:var(--secondary)}
.mcl{margin:4px 0 0;font-weight:600}
.sec{margin-top:32px}
.sh{margin:0 0 2px;font-size:15px;color:var(--secondary)}
.sub{margin:14px 0 2px;font-size:13px;color:var(--caption)}
.list>.sub:first-child{margin-top:4px}
.lk{color:inherit;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.fld.apps{width:100%;text-overflow:ellipsis}
.cap{display:block;font-size:15px;color:var(--secondary);line-height:1.45;margin-top:1px;white-space:pre-line}
.pre,.srow .body{white-space:pre-line}
/* A Remark is edited where it reads: caption size and colour, as wide as its text (only the event's Remarks is a box) */
.rmkl{display:block;margin-top:6px}
.rmkl .fld{font-size:15px;line-height:1.45;color:var(--secondary)}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:15px;line-height:1.45;color:var(--secondary);margin-top:2px}
.who>*{vertical-align:0}
.who .pn{margin-right:0}
.who .nw{display:inline-flex;align-items:center;gap:5px}
.who .isym,.who .nob{display:grid;place-items:center}
.muted,.t{color:var(--secondary)}
.t,.tn{font-variant-numeric:tabular-nums}
.empty{color:var(--secondary);margin:6px 0}
/* Rows sit on the canvas. A fill shows only when pressed, or for what is happening now. */
.list{display:flex;flex-direction:column}
/* A row's fill reaches 20 px beyond its text, so an update dot (12 px left of the text) sits inside it, as Mail's unread dot */
.row{--rp:12px;position:relative;display:grid;column-gap:14px;align-items:center;width:calc(100% + 40px);min-height:50px;margin:0 -20px;padding:var(--rp) 20px;border-radius:12px;background:transparent}
button.row:active,[data-a].row:active{background:var(--current)}
@media (hover:hover){button.row:hover,div.row[data-a]:hover{background:var(--current)}}
[data-a].row{cursor:pointer}
.row.current{background:var(--current)}
.g-ic{grid-template-columns:22px minmax(0,1fr) auto 18px}   /* symbol | name | detail | › */
.g-ice{grid-template-columns:22px minmax(0,1fr) auto 18px 24px}   /* symbol | name | detail | › | − (Edit) */
.g-p{grid-template-columns:22px minmax(0,1fr)}               /* symbol | value */
.g-p.top{align-items:start}
.g-p.top>.ic{margin-top:4px}
.g-tm{grid-template-columns:var(--tc) minmax(0,1fr) auto;align-items:start}  /* time or date | what | › */
.g-tme{grid-template-columns:var(--tc) minmax(0,1fr) auto;align-items:start} /* time or date | what | − and handle (Edit) */
.g-ev{grid-template-columns:var(--dw,max-content) minmax(0,1fr) auto}      /* date | event | (flag) › */
.g-ev>.tail{display:flex;align-items:center;gap:10px}
.g-ev .lf svg.i{width:16px;height:16px}
.g-kv{grid-template-columns:4.2em minmax(0,1fr) 24px}       /* class | name | − */
.g-opt{grid-template-columns:minmax(0,1fr) 22px}
/* The Rundown line a task is on, named above the task; in Edit, when and which group are chosen there */
.lnm{display:block;font-size:15px;color:var(--secondary);line-height:1.45}
.lpk{font-size:15px;color:var(--secondary);margin-bottom:2px}
.list.tasks>.sh{margin:0 0 2px}
.list.tasks>.row+.sh,.list.tasks>.sh+.sh{margin-top:24px}
.fld+.box{margin-top:6px}
.g-acct{grid-template-columns:22px minmax(0,1fr) auto}      /* key | account | password */
.ic{color:var(--secondary);display:grid;place-items:center}
.gA,.gA svg.i{color:var(--ga)!important}.gB,.gB svg.i{color:var(--gb)!important}.gC,.gC svg.i{color:var(--gc)!important}.gD,.gD svg.i{color:var(--gd)!important}
.who .isym svg.i,.pk .isym svg.i{width:15px;height:15px}
.pk .isym{color:var(--secondary)}
.gAll,.gAll svg.i{color:var(--text)!important} /* Everyone: white in dark, ink in light */
.go{width:18px;height:18px;color:var(--caption)}
.me{font-weight:600}
/* An update not yet seen: a Strong Yellow dot in the margin, as Mail's unread dot (not for the person who made it) */
.go.dis{transition:transform .2s ease}
.gx.open .go.dis{transform:rotate(180deg)}
.gbody{padding-bottom:8px}
/* An open disclosure and everything it shows sit in one callout of the pressed colour (26/10/04), so the opened part reads
   as belonging to its row; inside it, a pressed row takes the next fill */
.opened{position:relative;isolation:isolate;margin:0 -20px;padding:0 20px;border-radius:16px;background:var(--current)}
@supports (corner-shape:squircle){.opened{corner-shape:squircle}}
/* Apple's continuous corner (a squircle): an SVG drawn behind the callout at its size (squircles()); Safari has no corner-shape */
.opened.sq{background:transparent;border-radius:0}
.opened>svg.sqbg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;overflow:visible}
.list[data-range]{position:relative;isolation:isolate}
.list[data-range]:not(.moving-list)>p.sub.emp{display:none}
/* Inside a callout a pressed row is inset 8 px from the callout's edges, its corners concentric with the callout's (16 - 8) */
.opened .gbody .row,.opened>.row:not(:first-child),.list[data-range]>[data-in].row:not(.gx){--rx:12px;width:calc(100% + 24px);margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px;border-radius:8px}
.list[data-range]>svg.sqbg{position:absolute;z-index:-1;pointer-events:none;overflow:visible}
.list[data-range]:not(.sq)>[data-in]{background:var(--current)}
.opened>svg.sqbg path,.list[data-range]>svg.sqbg path{fill:var(--current)}
.list[data-range]>.gx[data-in],.list[data-range]>.gx[data-in]:hover,.list[data-range]>.gx[data-in]:active{background:transparent!important}
/* The disclosure is pressed while it is open: it belongs to the callout and takes no fill of its own */
.opened>.row:first-child,.opened>.row:first-child:hover,.opened>.row:first-child:active{background:transparent!important}
.opened button.row:active,.opened [data-a].row:active,.opened .row.current{background:var(--field)}
@media (hover:hover){.opened button.row:hover,.opened div.row[data-a]:hover{background:var(--field)}}
.ssec{margin-top:2px}
.list.gl>.gh+.sub,.list.gl>.sub:first-child{margin-top:2px}
.list.gl>.row+.gh,.list.gl>.sub+.gh{margin-top:18px}
.udot{position:absolute;left:calc(var(--rx,20px) - 16px);top:calc(var(--rp,9px) + .75em - 4px);width:8px;height:8px;border-radius:50%;background:var(--primary)}
.tk,.ln{position:relative}  /* a Rundown line holds its own dot (26/10/04: the dot had floated to the page's corner) */
.tk>.udot{left:-14px;top:calc(5px + .75em - 4px)}
.ln>.udot{top:calc(10px + .75em - 4px)}
.srow,.award h2,.lh{position:relative}
.srow>.udot,.award h2>.udot{left:-16px;top:calc(.875em - 4px)}
.badge{color:var(--danger);font-variant-numeric:tabular-nums}  /* a red digit, never a ball (26/10/02) */
.nob{color:var(--danger);display:inline-grid;vertical-align:-4px}
.nob.plain{color:var(--secondary)}
.nob svg.i{width:19px;height:19px}
.isym{display:inline-grid;vertical-align:-3px;color:var(--secondary)}
.isym svg.i{width:17px;height:17px}
/* Tasks under a Rundown line: owner's symbol | task, remark, people */
.tk{display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:10px;align-items:start;padding:5px 0;font-size:16px}
.tk>.ic{margin-top:2px}
button.tk{width:calc(100% + 16px);margin:0 -8px;padding:5px 8px;border-radius:10px;grid-template-columns:22px minmax(0,1fr) 18px}
button.tk>.go{align-self:center}
button.tk:active{background:var(--current)}
@media (hover:hover){button.tk:hover{background:var(--current)}}
.tk>.ic svg.i{width:18px;height:18px}
/* Rundown: time | line, its place and its tasks */
.ln{display:grid;grid-template-columns:var(--tc) minmax(0,1fr);column-gap:14px;align-items:start;width:calc(100% + 40px);margin:0 -20px;padding:10px 20px;border-radius:12px}
.ln.e{grid-template-columns:var(--tc) minmax(0,1fr) auto}
.ln.current{background:var(--current)}
.ln>.t{padding-top:1px}
.lt{font-weight:600}
.lb>.tk:first-of-type{margin-top:4px}
/* Script: MC | words; stage directions and awardees in the words column */
.srow{display:grid;grid-template-columns:4.6em minmax(0,1fr);column-gap:14px;align-items:start;line-height:1.75;margin:0 0 14px}
.srow.e{grid-template-columns:4.6em minmax(0,1fr) auto}
.sblk{margin:0 0 14px;background:var(--canvas)}
.slist>.srow.e{background:var(--canvas)}
.srow .sp{font-weight:600;white-space:nowrap}
.srow.cue .body,.srow.cue textarea{color:var(--secondary);font-size:15px}
.aws{display:grid;grid-template-columns:3.4em minmax(0,1fr);line-height:1.75}
.aws .c{font-variant-numeric:tabular-nums;color:var(--secondary)}
.awn{display:block}
.srow.lrow{margin:0}
.srow.lrow+.srow:not(.lrow){margin-top:14px}
.awn{font-size:15px;color:var(--secondary)}
.end{text-align:center;font-style:italic;color:var(--secondary);margin:36px 0 0}
.lh{margin:28px 0 10px;font-size:15px;color:var(--secondary)}
.lh:first-child{margin-top:0}
.award h2{font-size:17px;font-weight:600;margin:0 0 2px}
.award+.award{margin-top:28px}
/* Tags (roles) */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;padding:1px 10px;border-radius:999px;background:var(--field);font-size:15px;line-height:1.5;white-space:nowrap}
/* Attendance: ○ not yet, green ● here, − on leave */
.ck{width:44px;height:44px;margin:-10px -6px -10px -11px;display:grid;place-items:center;color:var(--caption)}
.ck svg.i{width:24px;height:24px}
.ck.on{color:var(--present)}
.g-mem{grid-template-columns:minmax(0,1fr) auto 18px}
.g-mem.lv .nmw{opacity:.45}
.nmw{display:flex;align-items:center;gap:8px;min-width:0}
.nmw .pn .av{width:28px;height:28px;font-size:13px}
.nmw .pn{gap:10px}
.g-chk{grid-template-columns:22px minmax(0,1fr)}
.nmw .tm{display:inline-flex;align-items:center;gap:4px}
.okm{width:16px;height:16px;color:var(--present)}
.ck.lv{color:var(--caption)}
.nmw .tm{font-size:15px;color:var(--secondary);font-variant-numeric:tabular-nums}
/* ---------- Edit: the same page; a field is as wide as its text, grows as you type and wraps only at the edge ---------- */
.fld{font:inherit;color:inherit;background:transparent;border:0;outline:none;margin:0;padding:0;border-radius:8px;box-sizing:content-box;min-width:2em;max-width:calc(100% - .9em);vertical-align:top;line-height:1.5;resize:none;overflow:hidden;-webkit-appearance:none;appearance:none}
textarea.fld{display:inline-block}
.fld::placeholder{color:var(--caption);opacity:1}
.f{background:transparent;padding:2px .45em;margin-inline:-.45em}
.f:placeholder-shown,.f.empty{background:var(--field)}
.f:focus,.f:focus-within{background:var(--current)}
.upper{text-transform:uppercase} /* tell-ok: class codes are capitals, e.g. 4A */
.upper::placeholder{text-transform:none}
/* Free text that is meant to be long (Remarks, a task's Remark, a script paragraph): the full width */
.box{display:block;box-sizing:border-box;width:calc(100% + .9em);max-width:none}
.fo{display:block;box-sizing:border-box;width:calc(100% + .9em);max-width:none;padding:0 .45em;margin-inline:-.45em}
.fo:placeholder-shown{background:var(--field)}
.fo:focus{background:var(--current)}
/* Fields side by side: each field's fill reaches .45em beyond its text on both sides, so a field that wraps to the next line starts on the same edge as the one above */
.fl{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px calc(.9em + 4px)}
.fl>.f{margin-inline:-.45em}
.fl>:first-child{margin-left:-.45em}
/* Title in Edit: "date｜name" wraps as in reading. The name field runs on from the date (text-indent) and under it. */
.tline{position:relative;display:flow-root}
.tpre{position:absolute;left:0;top:0;z-index:1;display:inline-block;white-space:nowrap}
.tpre .sep{margin-left:.3em}
.tline .tname{display:block;overflow-wrap:normal;box-sizing:border-box;width:calc(100% + .9em);max-width:none}
.pw .fld{max-width:none;white-space:nowrap}
.tm{font-variant-numeric:tabular-nums}
.tch{display:flex;flex-direction:column;gap:6px}
.fld.muted{color:var(--secondary)}
.pk .ph{color:var(--caption)}
.fld.need,.pk.need{background:color-mix(in srgb,var(--danger) 18%,transparent)}.fld.need::placeholder,.pk.need .ph,.pk.need svg.i,.row.add.need,.row.add.need>svg.i{color:var(--danger)}  /* what Done is waiting for */
.pk{position:relative;display:inline-flex;align-items:center;gap:6px;border-radius:8px;line-height:1.5;max-width:calc(100% - .9em)}
.pk svg.i{width:14px;height:14px;color:var(--caption)}
.pk select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px;cursor:pointer}
.ib{width:32px;height:32px;margin:-4px -4px -4px 0;display:grid;place-items:center;border-radius:999px;flex:none;justify-self:end}
.ib.rm{color:var(--danger);visibility:hidden}
*:focus-within>.ib.rm,*:focus-within>.rg>.ib.rm{visibility:visible}
@media (hover:hover) and (pointer:fine){*:hover>.ib.rm,*:hover>.rg>.ib.rm{visibility:visible}}
/* Delete and move, at the end of a row in Edit; the handle is always there, as in Apple's lists */
.rg{display:flex;align-items:center;justify-self:end;margin-right:-4px}
.rg>.ib{margin:-4px 0}
.rg>.grip,.rg>.nogrip{width:28px}
.rg>.nogrip{flex:none}
/* The insert line: gold, full width, with a ＋ fixed at the leading edge (mouse only) */
/* With a mouse the insert line replaces Add Line and Add Task (kept by touch, and for an empty Rundown) */
.ins{position:absolute;left:-20px;right:-20px;height:0;z-index:4;pointer-events:none}
.ins::before{content:"";position:absolute;left:20px;right:20px;top:-1px;height:2px;border-radius:1px;background:var(--primary)}
.ins-b{position:absolute;left:-6px;top:-13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);pointer-events:auto;box-shadow:var(--glass-shadow)}
.ins-b svg.i{width:16px;height:16px;stroke-width:2.4} /* stroke-ok: plus mark */
.ib.grip{color:var(--caption);touch-action:none;cursor:grab}
.ib.grip svg.i{width:20px;height:20px}
.lift{position:relative;z-index:3;background:var(--canvas);box-shadow:var(--glass-shadow);transition:none!important}
.moving-list>[data-drag]:not(.lift){transition:transform .18s ease}
[tabindex="-1"]{outline:none}
.ib.rm svg.i{width:22px;height:22px}
.ib.eye{color:var(--secondary)}
/* Add: a gold ⊕ in the list's own first column, an ink label */
.row.add{grid-template-columns:22px minmax(0,1fr)}
.row.add.cols{grid-template-columns:var(--c1,var(--tc)) minmax(0,1fr)}
.row.add>svg.i{width:22px;height:22px;color:var(--primary)}
.pw{display:inline-flex;align-items:center;gap:8px;justify-self:end}
.pw .pv{font-variant-numeric:tabular-nums;color:var(--secondary)}
.pw .mask{font-family:Georgia,serif;letter-spacing:.08em}
/* MC line: class and name per MC; an empty slot at the end adds the next MC, as in MC Scripts */
.mcs{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 0;margin:4px 0 0 -.45em;font-weight:600}
.mcs .mc{display:inline-flex;gap:6px}
.dot{color:var(--secondary);margin:0 .3em;font-weight:400}
.mcs .dot{margin:2px .3em 0}
.mcs .f{margin-inline:0}
/* ---------- Menus: glass, a symbol before each item ---------- */
.mbg{position:fixed;inset:0;z-index:39}
.menu{position:fixed;z-index:40;min-width:220px;max-width:calc(100vw - 48px);padding:6px;border-radius:18px;display:flex;flex-direction:column;background:var(--glass-hi);overflow-y:auto;overscroll-behavior:contain}
/* While a sheet, a menu or an alert is open, only it scrolls: the page behind stays where it is */
@media (pointer:fine){html.locked,html.locked body{overflow:hidden}}
.mbg,.dimbg,.alert{touch-action:none}
.menu button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;font-size:16px}
.menu button svg.i{color:var(--secondary)}
@media (hover:hover){.menu button:not(:disabled):hover{background:var(--field)}}
.menu button:disabled{opacity:.4;cursor:default}
/* ---------- Sheets ---------- */
/* Help: the library's rows, the download ring, and the video layer (no edge, the library dimmed behind it) */
.hh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hh .nb{flex:none}
.g-hv{grid-template-columns:22px minmax(0,1fr)}
.dlr{width:22px;height:22px;transform:rotate(-90deg)}
.dlr circle{fill:none;stroke-width:2.2}
.dlr .tr{stroke:var(--field)}.dlr .pr{stroke:var(--text);transition:stroke-dashoffset .2s}
.dlr .st{fill:var(--text);stroke:none}
/* A video plays on black, as in a video app, so its light pages do not glare in dark mode; Close sits on the video's corner and the
   controls under it, never over the steps being shown (review 26/10/04) */
.hvbg{position:fixed;inset:0;z-index:30;background:#000;display:grid;place-items:center;overscroll-behavior:contain} /* tell-ok: video backdrop */
.hv{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:12px;width:min(calc(100vw - 32px),calc((100dvh - 132px) * 1080 / 1554))}
.hv video{display:block;width:100%;aspect-ratio:1080/1554;border-radius:24px;background:#000;object-fit:cover} /* tell-ok: video backdrop */
.hvx{position:absolute;right:12px;top:12px;z-index:1}
.hvbg{--glass:rgba(44,44,41,.66);--text:#F2F0EA;--secondary:#B0AEA5;color:var(--text)} /* tell-ok: the dark mode tokens, since the backdrop is black in both modes */
.hvc{height:48px;border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 16px 0 6px}
.hvp{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.hvp svg.i{width:20px;height:20px;fill:currentColor} /* stroke-ok: play and pause are filled shapes */
.hvr{flex:1;min-width:0;accent-color:var(--text);height:24px}
.hvt{min-width:3.2em;text-align:right;font-size:15px}
.dimbg{position:fixed;inset:0;z-index:20;background:var(--dim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:90vh;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;background:var(--canvas);border-radius:24px 24px 0 0;padding:20px 24px calc(28px + env(safe-area-inset-bottom,0px))} /* the bar's 44 px buttons sit 4 px into its 52 px: 24 px from the top and the side alike */
.sheet.tall{min-height:72vh}
@media (min-width:700px){.dimbg{align-items:center}.sheet{border-radius:24px}}
.sbar{display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;column-gap:8px;align-items:center;min-height:52px;margin-bottom:12px}
.sbar h2{margin:0;font-size:17px;font-weight:600;text-align:center;line-height:1.3}
.sbar h2 .s2{display:block;font-size:13px;font-weight:400;color:var(--secondary);max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar>:first-child{justify-self:start}
.sbar>:last-child{justify-self:end}
.sheet .note{margin:-6px 0 12px;color:var(--secondary);font-size:15px;text-align:center}
.sheet .sh{margin-top:4px}
.sheet .sbar+.sec{margin-top:0}
.sheet .st{font-size:22px;font-weight:600;line-height:1.3;margin:0 0 12px}
/* A switch, as iOS: on is green */
.switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:999px;background:var(--field);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s} /* tell-ok: the switch knob is white in both themes, as iOS */
.switch:checked{background:var(--present)}
.switch:checked::after{transform:translateX(20px)}
.av{position:relative;border-radius:50%;background:var(--field);display:grid;place-items:center;font-weight:600;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av .ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(26,26,24,.5);color:#FBFAF7;opacity:0;transition:opacity .15s} /* tell-ok: white symbol over a dimmed photo */
.av .ov svg.i{width:26px;height:26px}
@media (hover:hover){.avb:hover .ov{opacity:1}}
.avb:focus-visible .ov{opacity:1}
.pn{display:inline-flex;align-items:center;gap:5px;margin-right:10px;cursor:pointer;white-space:nowrap;vertical-align:-4px}
.pn:last-child{margin-right:0}
.pn .av{width:20px;height:20px;font-size:11px}
.g-p .pn{gap:7px}
.g-p .pn .av{width:24px;height:24px;font-size:13px} /* beside a fact's 20 px symbol, a photo needs the larger circle to read as the same size */
.pn:hover>span:last-child{text-decoration:underline;text-underline-offset:3px}
.gtap:not(.gs):hover{text-decoration:underline;text-underline-offset:3px}
.opt-n{display:inline-flex;align-items:center;gap:10px}
.opt-n .av{width:28px;height:28px;font-size:13px}
.me-row{display:grid;grid-template-columns:60px minmax(0,1fr);column-gap:14px;align-items:center;margin:4px 0 6px}
.me-row .av{width:60px;height:60px;font-size:24px}
.g-sw{grid-template-columns:32px minmax(0,1fr)}
.g-sw .av{width:32px;height:32px;font-size:15px}
.g-sw .ic{width:32px}
.g-mb{grid-template-columns:32px minmax(0,1fr) auto}         /* photo | name | class */
.gtap{cursor:pointer}
.gs{display:grid;place-items:center}
.gav{color:var(--secondary)}
.me-row .gav svg.i{width:30px;height:30px}
/* Sign in, Loading and Who Are You? fit one screen: no page padding, so they never scroll */
.page.fixed{padding:0}
.gate{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:480px;margin:0 auto;padding-block:40px}
/* A tag inside a Remark reads as part of the sentence: a small photo, the name on the same line as the words around it */
.pre .pn,.cap .pn{vertical-align:top;height:1.5em;margin:0 3px;gap:4px}
.cap .pn{height:1.45em}
.pre .pn .av,.cap .pn .av{width:18px;height:18px;font-size:10px}
/* A tagged name is in Strong Yellow (26/10/03); in light mode the Design System's Text Yellow, so it stays readable on ivory */
.pre .pn>span:last-child,.cap .pn>span:last-child{color:var(--fill)}
.mpop{position:fixed;z-index:42;min-width:220px;max-width:calc(100vw - 32px);max-height:320px;overflow-y:auto;padding:6px;border-radius:18px;background:var(--glass-hi);display:flex;flex-direction:column}
.mpop button{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:10px;align-items:center;min-height:44px;padding:4px 10px;border-radius:12px;font-size:16px;line-height:1.3}
.mpop button .av{width:28px;height:28px;font-size:13px}
.mpop button .cap{font-size:13px;margin:0}
.mpop button.on{background:var(--field)}
@media (hover:hover){.mpop button:hover{background:var(--field)}}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));padding:10px 18px;border-radius:999px;font-size:15px;max-width:calc(100vw - 48px)}
.toast.act{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 18px}
.toast .msg{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .tb{height:36px;padding:0 14px;border:0;border-radius:999px;background:none;color:inherit;font:inherit;font-weight:600;cursor:pointer}
.toast .tb:hover{background:var(--current)}
.alert{position:fixed;z-index:45;inset:0;display:grid;place-items:center;background:var(--dim);padding:24px}
.alert>div{width:min(300px,100%);background:var(--glass-hi);border-radius:22px;padding:18px 16px 12px;text-align:center}
.alert h2{margin:0;font-size:17px}
.alert p{margin:6px 0 14px;font-size:15px;color:var(--secondary)}
.alert .b{display:flex;gap:8px}
.alert .b button{flex:1;min-height:44px;border-radius:999px;background:var(--field);text-align:center}
.alert .b .d{color:var(--danger);font-weight:600}
@media (min-width:600px){:root{--tc:4.2em}}
/* Sign in, and pick your name on a shared account */
.gate.load{align-items:center;justify-content:center;gap:24px}
.bigic{color:var(--secondary);display:grid;place-items:center;animation:breathe 1.6s ease-in-out infinite}
.bigic svg.i{width:128px;height:128px;stroke-width:1.2} /* stroke-ok: a large symbol keeps a fine line */
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.55}50%{transform:scale(1.04);opacity:1}}
@media (prefers-reduced-motion:reduce){.bigic{animation:none}}
.gate .in{display:block;width:100%;height:50px;border:0;outline:none;border-radius:12px;background:var(--field);padding:0 14px;font-size:17px;margin:0 0 10px;-webkit-appearance:none;appearance:none}
.gate .in:focus{background:var(--current)}
.gate .in::placeholder{color:var(--caption)}
.gate form .nb.pri{width:100%;margin-top:8px}
.gate .err{color:var(--danger);min-height:1.5em;margin:12px 0 0;font-size:15px}
.gate .low{margin-top:28px;align-self:center;color:var(--secondary)}
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:18px 8px;margin-top:24px}
.face{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 4px;border-radius:14px;text-align:center}
.face:active{background:var(--current)}
/* 活動後問卷: the questions read down the page, as the event page does */
.gate.fb{justify-content:flex-start;padding-top:max(56px,env(safe-area-inset-top,0px))}
.fq{font-size:17px;font-weight:600;margin:0 0 10px;text-wrap:balance}
.fbq+.fbq{margin-top:36px}
.fbo{background:var(--field);border-radius:14px;padding:4px;overflow:hidden}
.fbo>.row{width:100%;margin:0;padding:10px 12px;border-radius:10px}
.fbo>.g-opt{grid-template-columns:minmax(0,1fr)}
.fbo>.row.on,.fbo>.row.on:active{background:var(--primary);color:var(--on-primary)}
.fbo>.row.on .av{color:var(--text)} /* a photo's initial keeps its own colour on the yellow fill */
/* Chosen answers next to each other join into one fill, as consecutive selected rows do in Finder and Mail:
   only the outer corners stay round (26/10/04 20:33: three separate pills stacked edge to edge looked notched) */
.fbo>.row.on+.row.on{border-top-left-radius:0;border-top-right-radius:0}
.fbo>.row.on:has(+.row.on){border-bottom-left-radius:0;border-bottom-right-radius:0}
.fbo .tag{background:var(--canvas)}
@media (hover:hover){.fbo>.row:not(.on):hover{background:color-mix(in srgb,var(--text) 6%,var(--field))}}
.fbo>.row:not(.on):active{background:color-mix(in srgb,var(--text) 10%,var(--field))}
.fbo .tag.on{background:var(--primary)}
.fbp{margin:0 0 10px;color:var(--secondary);white-space:pre-line}
.tag.on{background:var(--primary);color:var(--on-primary)}
.gate .done{width:100%;margin-top:28px}
.fld.fbin{display:block;width:100%;max-width:none;box-sizing:border-box;margin:8px 0 0;padding:12px 16px;border-radius:12px;background:var(--field);font-size:17px}
.fld.fbin:focus{background:var(--current)}
.fbr{grid-template-columns:minmax(0,1fr);row-gap:2px}
.fbw{display:flex;align-items:center;gap:6px;min-width:0}
.fbw .gl{font-size:15px;color:var(--secondary)}
.g-kv .pk{white-space:nowrap}
.rmkl.empty{display:none}
/* The task last tapped keeps its empty Remark box until another task is tapped, not only while its field has the cursor:
   hiding it when the cursor leaves moved Add Task up under a finger already on its way (26/10/04, found re-recording videos) */
.g-tme.cur .rmkl.empty{display:block}
.noline,.noline .pk,.noline .ph{color:var(--danger)}
.fbtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fbg{grid-template-columns:auto minmax(0,1fr);column-gap:16px}
.fbg .pct{font-size:22px;font-weight:600;color:var(--danger);font-variant-numeric:tabular-nums}
.fbg .pct.ok{color:var(--present)}
.meter{position:relative;height:6px;border-radius:3px;background:var(--field)}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--danger)}
.meter i.ok{background:var(--present)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--secondary)}
.fbo .av{background:var(--canvas)}
.face .av{width:64px;height:64px;font-size:26px}
.g-ev .av,.g-sw .av{font-size:15px}
</style>

<script>
/* ---------- Data from the server ---------- */
let TODAY = new Date(Date.now() + 8 * 3600e3).toISOString().slice(2, 10).replace(/-/g, '/');
const NOW = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(11, 16);
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ALL_GROUPS = ['MC', 'Backstage', 'Reception'].flatMap(k => ['A', 'B', 'C', 'D'].map(x => `${k} Group ${x}`));
const kind = g => g === 'All' ? 'All' : g.split(' ')[0];
const SYM = {MC: 'mic', Backstage: 'curtain', Reception: 'wave', All: 'all'};
// The chairs keep the rosters (copied from List of Members). The server stores {lead: {cls, name}, people: [{cls, name}]};
// this page keeps [class, name] pairs.
let CHAIRS = [], ADMINS = [], ROSTER = {}, EVENTS = [], PHOTOS = {};
const roster = g => ROSTER[g] = ROSTER[g] || {lead: ['', ''], people: []};
const members = g => ROSTER[g] ? [ROSTER[g].lead[1], ...ROSTER[g].people.map(p => p[1])].filter(Boolean) : [];
const rosterIn = o => Object.fromEntries(Object.entries(o || {}).map(([g, r]) => [g, {lead: [((r || {}).lead || {}).cls || '', ((r || {}).lead || {}).name || ''], people: ((r || {}).people || []).map(p => [p.cls || '', p.name || ''])}]));
const rosterOut = o => Object.fromEntries(Object.entries(o).map(([g, r]) => [g, {lead: {cls: r.lead[0].trim(), name: r.lead[1].trim()}, people: r.people.filter(p => p[1].trim()).map(p => ({cls: p[0].trim(), name: p[1].trim()}))}]));
const clsOf = (g, n) => { const r = roster(g); return r.lead[1] === n ? r.lead[0] : ((r.people.find(p => p[1] === n) || [])[0] || ''); };
let APPS = null;  // the Event Lead's link to the CA Support form's sheet: {url, error}
let PASSWORDS = {};  // new passwords typed on a Users & Groups page, sent on Done
// Stand-ins in force ({id, grp, person, until})
let STANDINS = [];
// A time from the server as 05/10 20:03 (Hong Kong)
const hkAt = ms => { const d = new Date(ms + 8 * 3600e3).toISOString(); return md(d.slice(2, 10).replace(/-/g, '/')) + ' ' + d.slice(11, 16); };
// What a person needs to sign in, ready to paste into a message
const signInText = (id, pw, more) => `Event Centre：${location.origin}\nAccount：${id}\nPassword：${pw}` + (more ? '\n' + more : '');
const TEACHER_MORE = '登入後可查看 閣下任 Leading 或 Supporting Teacher 之活動。';
const teacherCode = x => String(x || '').trim().toUpperCase().replace(/\s+/g, '');
const taught = code => EVENTS.filter(e => [...(e.leading || []), ...(e.support || [])].some(x => teacherCode(x) === code));
// One account per small group (members pick their name), one per Group Lead, one for the chairs, one for teachers
// Editor: CA's own teachers, with the Event Lead's rights; each picks their name, as the chairs do in Event Lead. Viewer: any teacher, to read.
const ACCOUNTS = [{id: 'Event Lead', type: 'lead'}, {id: 'Editor', type: 'lead', admin: true}, {id: 'Viewer', type: 'teacher'},
  ...ALL_GROUPS.map(g => ({id: g, type: 'group', group: g})), ...ALL_GROUPS.map(g => ({id: g + ' Lead', type: 'gl', group: g}))];

/* ---------- Who is looking: the account signed in on this device, and the person who picked their name ---------- */
const S = {acct: null, who: null, seen: {}, toSee: new Set(), stack: [], edit: false, snap: null, sheet: null, menu: null, alert: null, open: {}, toast: '', find: ''};
// An account added while the site runs (a Group Lead's stand-in, a teacher's own) comes from the server at sign-in
let XACCT = null;
const ACCT = () => ACCOUNTS.find(a => a.id === S.acct) || (XACCT && XACCT.id === S.acct ? XACCT : null);
function V() {
  const a = ACCT(); if (!a) return null;
  if (a.type === 'lead') return {type: 'lead', name: S.who || a.id};
  if (a.type === 'teacher') return {type: 'teacher', name: a.id};
  if (a.standin) return {type: 'gl', name: a.person || a.id, group: a.group, standin: true};
  if (a.type === 'gl') return {type: 'gl', name: roster(a.group).lead[1] || a.id, group: a.group};
  return {type: 'member', name: S.who || a.id, group: a.group};
}
// The names to pick from on an account several people share
const peopleOf = a => !a ? [] : a.type === 'lead' ? (a.admin ? ADMINS : CHAIRS).filter(Boolean) : a.type === 'group' ? members(a.group).filter(n => n !== roster(a.group).lead[1]) : [];
const cur = () => S.stack[S.stack.length - 1], EV = () => EVENTS.find(e => e.id === (cur() || {}).ev);
const isLead = () => !!V() && V().type === 'lead';
const vt = () => V().type;
const seen = ev => isLead() || V().type === 'teacher' || ev.groups.some(g => g.name === V().group);
// Who changes a document: the Event Lead, and the on-duty group whose work it is (MC: Script; Backstage: Participant List; Reception: Guest List)
const DOC_KIND = {script: 'MC', awards: 'Backstage', guests: 'Reception'};
const canDoc = (ev, type) => isLead() || (['member', 'gl'].includes(V().type) && kind(V().group) === DOC_KIND[type] && ev.groups.some(g => g.name === V().group));

/* ---------- Helpers ---------- */
// Links typed in text (the teacher's attachments in Remarks) open in a new tab
const linked = s => esc(s).replace(/https?:\/\/[^\s<"]+/g, u => `<a class="lk" href="${u}" target="_blank" rel="noopener">${u}</a>`);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const ic = (n, c = '') => `<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
// A small group's symbol in its own colour: A red, B green, C blue, D purple, so MC Group A and MC Group B look different
// Colour marks the viewer's own work (26/10/02): a Group Lead or member sees only their own group's symbol in colour, others
// as plain as text; the red "no one yet" shows only where the viewer adds names (Event Lead: every group; Group Lead: their own)
const own = g => !V() || !['member', 'gl'].includes(V().type) || g === V().group;
const fills = g => !!V() && (isLead() || (V().type === 'gl' && g === V().group));
const gcls = g => own(g) ? ' g' + g.slice(-1) : '';
const gsym = g => sym(SYM[kind(g)], g, 'ic' + gcls(g));
const sym = (n, label, c = 'ic') => `<span class="${c}"${label ? ` role="img" aria-label="${esc(label)}"` : ''}>${ic(n)}</span>`;
const gname = g => g === 'All' ? 'Everyone' : esc(g).replace(/ Group /, ' Group&nbsp;');
// A group's symbol and its name open the group's card (26/10/04), as a person's photo and name open theirs; the rest of the
// row keeps its own job (a duty group still opens to its tasks)
const isGroup = g => ALL_GROUPS.includes(g);
const gtap = (g, html, c = '') => isGroup(g) ? `<span class="gtap${c}" data-a="gcard:${esc(g)}" role="button" tabindex="0">${html}</span>` : html;
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const iso = d => '20' + d.replace(/\//g, '-');
const fromIso = s => s ? s.slice(2).replace(/-/g, '/') : '';
const wd = d => d ? '（' + WEEK[new Date(iso(d) + 'T12:00').getDay()] + '）' : '';
// Dates are kept as YY/MM/DD (they sort) and shown day first: 26/10/05 -> 05/10/26, and 05/10 in a date column
const dmy = d => d ? d.slice(6, 8) + '/' + d.slice(3, 5) + '/' + d.slice(0, 2) : '';
const md = d => d ? d.slice(6, 8) + '/' + d.slice(3, 5) : '';
const rowOf = (ev, id) => ev.rows.find(r => r.id === id);
const onLeave = (ev, g, n) => !!(((ev.leave || {})[g] || {})[n]);
const tasksOf = (ev, g) => ev.tasks.filter(t => !t.role && t.to.includes(g));
const openCount = (ev, g) => g === 'All' ? 0 : tasksOf(ev, g).filter(t => !t.names.length).length;
const forMe = t => t.names.includes(V().name) || (t.to.includes('All') && !t.role);
// History: a change to the event (not attendance) keeps a copy of the event as it was before, so the Event Lead can go back to it.
// Copies stay on the newest 10 entries, within 400 KB.
const BARE = o => { const x = {...o}; ['log', 'upd', 'att', 'leave'].forEach(k => delete x[k]); return x; };
const log = (ev, what) => {
  let snap = null; try { const b = SYNC.base[ev.id] && BARE(JSON.parse(SYNC.base[ev.id])); if (b && J(b) !== J(BARE(ev))) snap = b; } catch (e) {}
  ev.log.unshift({at: TODAY + ' ' + NOW(), ts: Date.now(), who: V().name, what, ...(snap ? {snap} : {})});
  let size = 0; ev.log.forEach((x, i) => { if (!x.snap) return; size += J(x.snap).length; if (i >= 10 || size > 400000) delete x.snap; });
};
const evOfKey = key => EVENTS.find(e => key === e.id || key.startsWith(e.id + ':'));
const updOf = key => { const e = evOfKey(key); return e && e.upd ? e.upd[key] : null; };
const mySeen = () => S.seen[V().name] = S.seen[V().name] || {};
const isNew = key => { const u = updOf(key); return !!u && !!V() && u.by !== V().name && mySeen()[key] !== u.at; };
// A dot on something that opens (an event, a document) clears when it is opened; any other clears once its page has been seen
const dot = (key, opens) => { if (!isNew(key)) return ''; if (!opens) S.toSee.add(key); return '<span class="udot" role="img" aria-label="Updated"></span>'; };
const seeNow = key => { const u = updOf(key); if (u && V()) { mySeen()[key] = u.at; store.set('seen', S.seen); } };
const seePage = () => { if (V()) S.toSee.forEach(seeNow); S.toSee = new Set(); };
const nobody = g => `<span class="nob${fills(g) ? '' : ' plain'}" role="img" aria-label="No one yet">${ic('nobody')}</span>`;
const badge = n => `<span class="badge" aria-label="${n} without a name">${n}</span>`;
// A toast says what just happened; it may carry one action (MC Scripts' 復原), and then stays 8 seconds
const toast = (m, act, ms) => { S.toast = m; S.toastAct = act || null; layer(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = ''; S.toastAct = null; layer(); }, ms || (act ? 8000 : 2400)); };
const hasScript = ev => ev.rows.some(r => r.say.length);
// When a task happens: its date before the day, or its Rundown line's time. The time column holds only dates and times;
// the line itself is named above the task, so a line without a time still shows where the task is.
const whenOf = (ev, t) => !t.row ? md(t.date || '') : (rowOf(ev, t.row) || {}).time || '';
const lineOf = (ev, t) => t.row ? `<span class="lnm">${esc((rowOf(ev, t.row) || {}).title || '')}</span>` : '';
// Order: by date, then by Rundown line; tasks of one date or one line keep the order they were put in (dragged by their handle)
const order = (ev, t) => !t.row ? '0' + (t.date || '') : '1' + String(ev.rows.findIndex(r => r.id === t.row)).padStart(3, '0');
const sorted = (ev, list) => list.map((t, i) => [t, i]).sort((a, b) => order(ev, a[0]).localeCompare(order(ev, b[0])) || a[1] - b[1]).map(x => x[0]);
// The tasks a duty group sees: its own and Everyone's, in the event's own order
const groupTasks = (ev, g) => ev.tasks.filter(t => !t.role && (t.to.includes(g) || t.to.includes('All')));
const owner = t => t.to.includes('All') ? sym('all', 'Everyone', 'ic gAll') : t.to.length ? gtap(t.to[0], gsym(t.to[0]), ' gs') : `<span class="ic">${nobody()}</span>`;
const names = t => { if (t.to.includes('All') && !t.names.length) return ''; const v = V();
  return `<span class="who">${t.names.length ? t.names.map(n => mention(n, n === v.name)).join('') : nobody(t.to[0])}</span>`; };
const remark = t => t.remark ? `<span class="cap">${rich(t.remark)}</span>` : '';
// Everyone who can be tagged with @ in a Remark (26/10/03, as in Teams): the chairs, every group's members, and the
// teachers (26/10/09): CA's teachers (the Editor account) and every event's Leading and Supporting Teachers, once each by code
const teachers = () => { const seen = new Set();
  return [...ADMINS, ...EVENTS.flatMap(e => [...(e.leading || []), ...(e.support || [])])].map(x => String(x || '').trim())
    .filter(x => x && !seen.has(teacherCode(x)) && seen.add(teacherCode(x))); };
const taggable = () => [...new Set([...CHAIRS, ...ALL_GROUPS.flatMap(members), ...teachers()].filter(Boolean))];
// A Remark as read: links open, and @Name of a known person shows their photo and name (longest names first, so 陳大文 wins over 陳大)
function rich(s) {
  const ns = taggable().sort((a, b) => b.length - a.length).map(n => esc(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  // （影片：title） in a Remark (the Event Lead SOP's default Remarks) opens that help video, when one has that title
  const html = linked(s).replace(/（影片：([^）]+)）/g, (m, t) => { const v = HELP.find(x => x.title === t.replace(/&amp;/g, '&'));
    return v ? `（<span class="lk" role="button" tabindex="0" data-a="hv:${v.id}">影片：${t}</span>）` : m; });
  return ns.length ? html.replace(new RegExp('@(' + ns.join('|') + ')', 'g'), (m, n) => mention(n.replace(/&amp;/g, '&'), V() && n === V().name)) : html;
}
const named = ev => (ev.mcs || []).filter(m => m[1]);
// A line's MC: the one chosen, or the only MC when there is one (a line written before the MC was named has none of its own)
const spOf = (ev, s) => s.sp || (named(ev).length === 1 ? named(ev)[0][1] : '');
// Awardee and guest paragraphs: the rows they read, by index into the list; rows not yet read elsewhere go into a new one
const hasSource = (ev, s) => s.type === 'award' ? !!(ev.awards || {})[s.list] : s.type === 'guests' ? !!ev.guests : true;
const awardOf = (ev, s) => { const l = (ev.awards || {})[s.list]; return (l && l.awards.find(x => x.id === s.award)) || {award: '', rows: []}; };
const allRows = (ev, s) => s.type === 'award' ? awardOf(ev, s).rows : (ev.guests || []).map(g => [g.name, g.role]);
// Roll call: Backstage ticks the Participant List and Reception the Guest List; on the event's day the Script reads only those
// ticked. Before the day it shows every name (Build Brief 261004 item 5), so the draft sent to the teacher has them.
const rollKey = (ev, s, i) => s.type === 'award' ? `${s.award}:${(allRows(ev, s)[i] || [])[1] || ''}` : ((ev.guests || [])[i] || {}).id;
const isHere = (ev, s, i) => !!(((ev.roll || {})[s.type === 'award' ? 'aw' : 'gu'] || {})[rollKey(ev, s, i)]);
const hereRows = (ev, s) => paraRows(ev, s).filter(x => ev.date > TODAY || isHere(ev, s, x[0]));
const tick = (on, act, can, label) => can ? `<button class="ck${on ? ' on' : ''}" data-a="${act}" aria-pressed="${on}" aria-label="${esc(label)} is here">${ic(on ? 'check-fill' : 'circle')}</button>` : `<span class="ck${on ? ' on' : ''}" role="img" aria-label="${on ? 'Here' : 'Not here yet'}">${ic(on ? 'check-fill' : 'circle')}</span>`;
const paraRows = (ev, s) => { const all = allRows(ev, s); return (s.rows || all.map((x, i) => i)).filter(i => all[i] && all[i][s.type === 'award' ? 1 : 0]).map(i => [i, ...all[i]]); };
const sameList = (s, x) => x.type === s.type && (s.type === 'guests' || (x.list === s.list && x.award === s.award));
const unread = (ev, s) => { const used = new Set(ev.rows.flatMap(r => r.say).filter(x => sameList(s, x)).flatMap(x => paraRows(ev, x).map(r => r[0]))); return allRows(ev, s).map((x, i) => i).filter(i => !used.has(i) && allRows(ev, s)[i][s.type === 'award' ? 1 : 0]); };

// Rotation (as the live site): fewest duties since 1 September first; ties go A, B, C, D after the group that served most recently
function rotation(ev, k) {
  const all = ALL_GROUPS.filter(g => kind(g) === k), count = Object.fromEntries(all.map(g => [g, 0]));
  const from = (+ev.date.slice(3, 5) >= 9 ? ev.date.slice(0, 2) : String(+ev.date.slice(0, 2) - 1).padStart(2, '0')) + '/09/01';
  let last = null, key = '';
  EVENTS.filter(e => e.id !== ev.id && e.date >= from).forEach(e => e.groups.forEach(g => { if (!(g.name in count)) return; count[g.name]++; const kk = e.date + e.asmTime; if (kk >= key) { key = kk; last = g.name; } }));
  const start = last ? all.indexOf(last) + 1 : 0, dist = g => (all.indexOf(g) - start + 4) % 4;
  const also = g => EVENTS.filter(e => e.id !== ev.id && e.date === ev.date && e.groups.some(x => x.name === g)).map(e => e.name);
  return all.sort((a, b) => count[a] - count[b] || dist(a) - dist(b)).map(g => ({g, also: also(g)}));

      .then(r => { if (!r.ok) throw new Error(src); return r.arrayBuffer(); }).then(buf => {
        const len = buf.byteLength, ptr = ex.malloc(len);

        ex.hb_blob_destroy(blob); return face;

}
