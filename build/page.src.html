<title>MC Scripts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap">
<!-- Icons: Lucide (ISC licence), https://lucide.dev -->
<style>
:root{
  --canvas:#FBFAF7; /* tell-ok: CA Design System token */
  /* CA Design System: neutrals carry the page; Slate Dark is the one action colour; Text Yellow marks what still needs filling */
  --current:#F1EFE8; --field:#EDEBE3; --fill:#6E5916;
  --text:#1A1A18; /* tell-ok: CA Design System token */
  --secondary:#6B6A64; --caption:#85837C; --faint:#85837C;
  --danger:#9A3B2E; --btn:#1A1A18; --btn-text:#FBFAF7; /* tell-ok: CA Design System token */
  --glass:rgba(255,255,255,.62); --glass-hi:rgba(255,255,255,.9); --glass-sel:rgba(26,26,24,.9);
  --glass-shadow:0 1px 1px rgba(26,26,24,.04),0 8px 28px rgba(26,26,24,.12);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
  --pt:1.5455px;
  /* Where the content column starts; floating controls line up with it on wide screens */
  --side:max(16px, calc((100vw - 860px) / 2));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --canvas:#1C1C1A; --current:#262623; --field:#2E2D2A; --fill:#BAA877;
    --text:#F2F0EA; /* tell-ok: CA Design System token (dark) */
    --secondary:#B0AEA5; --caption:#8E8D87; --faint:#8E8D87;
    --danger:#E59A8C; --btn:#F2F0EA; --btn-text:#1A1A18; /* tell-ok: CA Design System token (dark) */
    --glass:rgba(44,44,41,.62); --glass-hi:rgba(70,70,66,.9); --glass-sel:rgba(242,240,234,.92);
    --glass-shadow:0 1px 1px rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#1C1C1A; --current:#262623; --field:#2E2D2A; --fill:#BAA877;
  --text:#F2F0EA; /* tell-ok: CA Design System token (dark) */
  --secondary:#B0AEA5; --caption:#8E8D87; --faint:#8E8D87;
  --danger:#E59A8C; --btn:#F2F0EA; --btn-text:#1A1A18; /* tell-ok: CA Design System token (dark) */
  --glass:rgba(44,44,41,.62); --glass-hi:rgba(70,70,66,.9); --glass-sel:rgba(242,240,234,.92);
  --glass-shadow:0 1px 1px rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--canvas)}
body{margin:0;color:var(--text);font-family:var(--serif);font-size:17px;line-height:1.6;padding-inline:16px;padding-block:0 120px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.3;cursor:default}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round} /* stroke-ok: line icons */

/* Control layer: one floating toolbar; content scrolls beneath it behind a scroll-edge fade */
.edge{position:fixed;top:0;right:0;z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) calc(var(--side) + env(safe-area-inset-right,0px)) 0 0;pointer-events:none}
.toolbar{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;pointer-events:none}
.glass{pointer-events:auto;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:var(--glass-shadow);border-radius:999px}
.group{display:flex;align-items:center;gap:2px;padding:4px}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;padding:0 12px;border-radius:999px;font-size:15px;color:var(--text)}
.tb:hover:not(:disabled){background:var(--glass-hi)}
.tb[aria-pressed="true"]{background:var(--glass-sel);color:var(--btn-text)}
.tb.prominent{background:var(--btn);color:var(--btn-text);font-weight:600;padding:0 18px;height:48px}
.tb:focus-visible{background:var(--glass-hi);outline:none}
.tb.prominent:focus-visible{opacity:.85}
@media (max-width:640px){.t-label{display:none}}

/* Back to the script list: leading edge */
.lead{position:fixed;top:0;left:0;z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) 0 0 calc(var(--side) + env(safe-area-inset-left,0px));pointer-events:none}
.lead .tb{width:48px;height:48px;padding:0}
.lead svg.i{width:22px;height:22px}

/* Views: the script list, or one script */
body[data-view="list"] .doc,body[data-view="list"] .edge,body[data-view="list"] .lead{display:none}
body[data-view="doc"] .lib{display:none}
.lib{max-width:860px;margin:0 auto;padding-top:72px}
/* Two text styles only: the page title, and one body size for everything in the list.
   Hierarchy comes from order, position, space and colour, not from more sizes and weights. */
.lib h1{font-size:34px;font-weight:700;line-height:1.2;margin:0 0 12px}
.lib .count{margin:0;font-size:17px;color:var(--secondary)}
/* The list: plain rows grouped by when the event is, no cards (easier to scan than a pile of boxes) */
.lib .section+.section{margin-top:24px}
.lib .sh{display:flex;align-items:center;gap:4px;min-height:44px;padding:0;font-size:17px;color:var(--secondary);cursor:pointer;text-align:left}
.lib .sh svg.i{width:16px;height:16px;transition:transform .2s ease}
.lib .sh[aria-expanded="false"] svg.i{transform:rotate(-90deg)}
.lib ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lib li{display:flex;align-items:center;margin:0 -12px;border-radius:12px}
.lib li:hover,.lib li:focus-within,.lib li.held{background:var(--current)}
.lib .item{flex:1;min-width:0;display:flex;align-items:baseline;gap:16px;min-height:48px;padding:12px;text-align:left;font-size:17px;line-height:1.4;border-radius:12px;outline:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.lib .when{flex:none;width:5.2em;color:var(--secondary);font-variant-numeric:tabular-nums}
.lib .t{flex:none;max-width:60%;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib .mcs{flex:1;min-width:0;color:var(--secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.lib .mcs{display:none}}
.lib .rowmore{flex:none;width:44px;height:44px;margin-right:4px;display:grid;place-items:center;border-radius:999px;color:var(--secondary)}
.lib .rowmore:hover,.lib .rowmore:focus-visible,.lib .rowmore[aria-expanded="true"]{background:var(--field);color:var(--text);outline:none}
.lib .emptystate{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.lib .emptystate svg.i{width:52px;height:52px;stroke-width:1.4;color:var(--caption);margin-bottom:8px} /* stroke-ok: line icons */
.lib .emptystate h2{margin:0;font-size:20px;font-weight:600}
.lib .emptystate p{margin:0;font-size:15px;color:var(--secondary)}
.lib .t.untitled{color:var(--caption)}

/* Search: a glass field in the control layer, bottom leading, level with the add button */
.search{position:fixed;z-index:20;left:calc(var(--side) + env(safe-area-inset-left,0px));right:calc(var(--side) + 56px + 12px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px) + var(--kb,0px));height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;cursor:text}
.search svg.i{color:var(--secondary)}
.search input{flex:1;min-width:0;height:100%;font:inherit;font-size:17px;color:var(--text);background:transparent;border:0;outline:none;padding:0;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--secondary)}
body:not([data-view="list"]) .search,body.noscripts .search{display:none}
.lib .nomatch{margin:40px 0 0;text-align:center;color:var(--secondary);font-size:15px}

/* Add button: floats at the bottom trailing corner */
.fab{position:fixed;z-index:20;right:calc(var(--side) + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px) + var(--kb,0px));width:56px;height:56px;display:grid;place-items:center;color:var(--text)}
.fab svg.i{width:24px;height:24px}
.fab:not([aria-disabled="true"]){background:var(--btn);color:var(--btn-text)}
.fab[aria-disabled="true"]{opacity:.3}
.fab:hover:not([aria-disabled="true"]){filter:brightness(1.08)}
.fab:focus-visible{outline:none;filter:brightness(1.15)}
.fab svg.i{transition:transform .2s ease}
.fab[aria-expanded="true"],.tb[aria-expanded="true"]{background:var(--btn);color:var(--btn-text)}
.fab[aria-expanded="true"] svg.i{transform:rotate(45deg)}

/* Menus and toast: also control layer */
.menu{position:fixed;z-index:30;min-width:220px;padding:6px;border-radius:18px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font-size:16px;text-align:left}
.menu button:hover:not(:disabled),.menu button:focus-visible{background:var(--glass-hi);outline:none}
.menu .danger{color:var(--danger)}
.menu .gap{height:6px}
.toast{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px + var(--vvtop,0px));display:flex;align-items:center;gap:6px;padding:4px 4px 4px 16px;font-size:15px;max-width:min(300px,calc(100vw - 32px))}
@media (max-width:760px){.toast{top:calc(env(safe-area-inset-top,0px) + 66px + var(--vvtop,0px))}}
.toast.plain{padding-right:16px;min-height:44px}
.toast .msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .msg.link{text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.toast.bad .msg{color:var(--danger)}
.toast .tb{height:36px}

/* Joining the shared scripts: a passcode, once per iPad */
body[data-view="join"]{padding-bottom:0}
.join{display:none;max-width:420px;min-height:100vh;min-height:100dvh;margin:0 auto;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
body[data-view="join"] .join{display:flex}
body[data-view="join"] .lib,body[data-view="join"] .doc,body[data-view="join"] .edge,body[data-view="join"] .lead,body[data-view="join"] .fab{display:none}
.join svg.i{width:52px;height:52px;stroke-width:1.4;color:var(--caption);margin-bottom:8px} /* stroke-ok: line icons */
.join h2{margin:0;font-size:20px;font-weight:600}
.join form{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:18px}
.join input{font:inherit;font-size:18px;height:50px;border:0;border-radius:14px;background:var(--field);color:var(--text);text-align:center;outline:none;-webkit-appearance:none;appearance:none}
.join input::placeholder{color:var(--caption)}
.join input:focus{background:var(--current)}
.join button{height:50px;border-radius:14px;background:var(--btn);color:var(--btn-text);font-weight:600}
.join .err{min-height:1.6em;margin:0;font-size:15px;color:var(--danger)}

/* Content layer: the script itself, laid out as it will print */
.doc{max-width:860px;margin:0 auto}
/* Inline fields: standard inputs (reliable with iPad Chinese input), sized to their text */
.fld{font:inherit;font-weight:inherit;color:inherit;background:transparent;border:0;outline:none;margin:0;padding:0 .05em;box-sizing:content-box;border-radius:8px;max-width:100%;min-width:2em;vertical-align:baseline;-webkit-appearance:none;appearance:none}
.fld::placeholder{color:var(--caption)}
.fld:placeholder-shown,.date.empty{background:var(--field);padding:0 .35em;border-radius:8px}
.fld:focus{background:var(--current)}
.title .fld,.mcline .fld{font-weight:600}
.hit{display:inline-block;padding:9px 0;margin:-9px 0;cursor:text}
.title{font-size:calc(20 * var(--pt));font-weight:600;line-height:1.3;margin:0 0 calc(6 * var(--pt));padding:72px 0 0;text-wrap:balance}
.title .sep{color:var(--secondary);margin:0 .15em}
.date{position:relative;display:inline-block;border-radius:6px}
.date input{position:absolute;left:0;top:-9px;width:100%;height:calc(100% + 18px);opacity:0;font-size:16px;-webkit-appearance:none;appearance:none;cursor:pointer}
.date .ph{color:var(--caption)}
.date:focus-within{background:var(--current)}
.mcline{font-size:calc(12 * var(--pt));font-weight:600;margin:0 0 calc(24 * var(--pt));display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 0}
.mcline .mc{display:inline-flex;gap:.2em;align-items:baseline}
.mcline .dot{color:var(--secondary);margin:0 .3em}
.upper{text-transform:uppercase} /* tell-ok: class codes are capitals, e.g. 3C12 */
.upper::placeholder{text-transform:none}
/* Something still to fill: its prompt turns Text Yellow, like the 填寫 lines in CA files */
.needs{background:var(--field)!important}
.needs,.needs::placeholder,.needs .ph,.needs textarea::placeholder,.needs input::placeholder,.needs .who{color:var(--fill)!important}
.row{cursor:text;display:grid;grid-template-columns:var(--ind) minmax(0,1fr) 40px;margin-inline:-10px;padding:4px 10px;border-radius:10px}
/* Each paragraph's own ⋯, at its end: shown on the paragraph being edited (and on hover), space kept so text never shifts */
.bmore{grid-column:3;grid-row:1;align-self:start;justify-self:end;width:44px;height:44px;margin:-10px -6px -10px 0;display:grid;place-items:center;border-radius:999px;color:var(--secondary);opacity:0;pointer-events:none}
.row.current .bmore,.row:hover .bmore,.bmore:focus-visible,.bmore[aria-expanded="true"]{opacity:1;pointer-events:auto}
.bmore:hover,.bmore:focus-visible,.bmore[aria-expanded="true"]{background:var(--field);color:var(--text);outline:none}
.row.current{background:var(--current)}
.row textarea{grid-column:2;font:inherit;color:inherit;background:transparent;border:0;outline:none;resize:none;overflow:hidden;padding:0;margin:0;width:100%;min-height:1.6em;line-height:1.6;display:block}
.row textarea::placeholder{color:var(--caption)}
.row.cue textarea{font-size:calc(9 * var(--pt));color:var(--secondary)}
.awards{grid-column:2;display:flex;flex-direction:column}
.aw{display:grid;grid-template-columns:calc(80 * var(--pt)) minmax(0,1fr)}
.aw input{font:inherit;color:inherit;background:transparent;border:0;outline:none;padding:0;margin:0;width:100%;min-width:0;line-height:1.6;height:1.6em;border-radius:4px}
.aw input::placeholder{color:var(--caption)}
.aw input.repeat{color:var(--faint)}
.aw input:focus{background:var(--canvas)}
.who{position:relative;align-self:start;display:inline-flex;align-items:center;gap:2px;font-weight:600;height:1.6em;width:max-content;max-width:100%;border-radius:6px}
.who.faint{color:var(--faint)}
.who.unset{color:var(--danger);font-weight:400}
.who select{position:absolute;inset:-9px -10px;width:calc(100% + 20px);height:calc(100% + 18px);opacity:0;font-size:16px;-webkit-appearance:none;appearance:none;cursor:pointer}
.who svg.i{width:14px;height:14px;color:var(--caption)}
.who:focus-within{background:var(--current)}
.end{text-align:center;font-style:italic;color:var(--secondary);margin-top:calc(16 * var(--pt))}
@media (max-width:640px){:root{--pt:1.3636px}body{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="lead">
  <button type="button" class="tb glass" id="back" aria-label="講稿列表" title="講稿列表"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-back"/></svg></button>
</div>

<div class="edge">
  <div class="toolbar" role="toolbar" aria-label="講稿工具">
    <div class="glass group">
      <button type="button" class="tb" id="share" aria-label="分享講稿" title="分享講稿"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-share"/></svg></button>
      <button type="button" class="tb" id="more" aria-label="更多" title="更多" aria-haspopup="menu" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-more"/></svg></button>
    </div>
  </div>
</div>

<section class="lib" aria-label="講稿列表">
  <h1>講稿</h1>
  <p class="count" id="libcount"></p>
  <div id="liblist"></div>
  <p class="nomatch" id="nomatch" hidden>冇相符嘅講稿</p>
  <div class="emptystate" id="libempty" hidden>
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-doc"/></svg>
    <h2>未有講稿</h2>
    <p>要新增講稿，請撳加號</p>
  </div>
</section>

<section class="join" aria-label="加入">
  <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-key"/></svg>
  <h2>輸入 CA 密碼</h2>
  <form id="joinform">
    <input id="code" aria-label="密碼" placeholder="密碼" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button type="submit">加入</button>
  </form>
  <p class="err" id="joinerr" role="alert"></p>
</section>

<main class="doc" id="doc" aria-label="講稿">
  <h1 class="title">
    <label class="date" id="date-wrap"><span id="date-text"></span><input type="date" id="date" aria-label="日期"></label><span class="sep">｜</span><label class="hit"><input class="fld" id="event" aria-label="活動名稱" placeholder="活動名稱" autocomplete="off" enterkeyhint="done"></label><span class="sep">｜</span><span id="doc-type">講稿</span>
  </h1>
  <div class="mcline" id="mcline" aria-label="司儀"></div>
  <div id="rows"></div>
  <p class="end">{End of Script}</p>
</main>

<label class="search glass" id="searchbar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg><input id="q" type="search" placeholder="搜尋" aria-label="搜尋講稿" autocomplete="off" enterkeyhint="search"></label>

<button type="button" class="fab glass" id="insert" aria-label="加" title="加" aria-haspopup="menu" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg></button>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 2v13"/><path d="m16 6-4-4-4 4"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
  <symbol id="i-updown" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>

      else toast("分享唔到（" + (code || (e && e.message) || "未知原因") + "）", true);
    }
  }
  function showMissing() {
    var d = ScriptGen.describe(state);
    showProblems = true; markProblems();
    toast(d.problems[0].msg + (d.problems.length > 1 ? "，另外 " + (d.problems.length - 1) + " 項" : ""), true, null, goToProblem);
    goToProblem();
  }
  $("share").onclick = function () {
    if (ScriptGen.describe(state).problems.length) { showMissing(); return; }
    deliver(ready, state);
  };

  function renderAll() {
    W = WORDS.yue; PH.line = W.line; PH.cue = W.cue; $("event").placeholder = W.event;
    $("event").value = state.event || ""; fit($("event"));
    $("date").value = state.date || "";
    renderDate(); renderMcs(); renderRows();
  }
  // A link ending in #k=passcode joins in one tap; the passcode is then removed from the address bar.
  var linkCode = /[#&]k=([^&]+)/.exec(location.hash);
  if (linkCode) history.replaceState(null, "", location.pathname + location.search);
  var space = null; try { space = localStorage.getItem(SPACE_KEY); } catch (e) {}
  var last = lib.open && find(lib.open);
  if (CLOUD && !space) { askSpace(); if (linkCode) { $("code").value = decodeURIComponent(linkCode[1]); join($("code").value); } }
  else {
    if (CLOUD) startCloud(space);
    if (last && !last.deleted) openScript(last.id); else { showView("list"); renderList(); updateAdd(); }
  }
})();
</script>
