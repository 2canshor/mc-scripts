<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Events">
<meta name="robots" content="noindex">
<title>Events</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
/* Tokens are the CA Design System's, as used by MC Scripts */
:root{
  --canvas:#FBFAF7; /* tell-ok: CA Design System token */
  --current:#F1EFE8; --field:#EDEBE3; --fill:#6E5916; --primary:#BAA877; --on-primary:#1A1A18; /* tell-ok: CA Design System tokens */
  /* tell-ok: MC Scripts' tinted glass for the add button */
  --primary-glass:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.06) 55%,rgba(255,255,255,0)),color-mix(in srgb,var(--primary) 84%,transparent);
  --text:#1A1A18; /* tell-ok: CA Design System token */
  --secondary:#6B6A64; --caption:#85837C;
  --present:#64C77B; /* tell-ok: CA attendance colour for Attended */
  --danger:#9A3B2E; --btn:#1A1A18; --btn-text:#FBFAF7; /* tell-ok: CA Design System token */
  --glass:rgba(255,255,255,.62); --glass-hi:rgba(255,255,255,.92);
  --glass-shadow:0 1px 1px rgba(26,26,24,.04),0 8px 28px rgba(26,26,24,.12);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
  --side:max(24px, calc((100vw - 860px) / 2));  /* content column and floating controls share one edge at every width, as in MC Scripts */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --canvas:#1C1C1A; /* tell-ok: CA dark tokens */ --current:#262623; --field:#2E2D2A; --fill:#BAA877;
    --text:#F2F0EA; /* tell-ok: CA Design System token (dark) */
    --secondary:#B0AEA5; --caption:#8E8D87;
    --danger:#E59A8C; --btn:#F2F0EA; --btn-text:#1A1A18; /* tell-ok: CA Design System token (dark) */
    --glass:rgba(44,44,41,.62); --glass-hi:rgba(70,70,66,.94);
    --glass-shadow:0 1px 1px rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#1C1C1A; /* tell-ok: CA dark tokens */ --current:#262623; --field:#2E2D2A; --fill:#BAA877;
  --text:#F2F0EA; /* tell-ok: CA Design System token (dark) */
  --secondary:#B0AEA5; --caption:#8E8D87;
  --danger:#E59A8C; --btn:#F2F0EA; --btn-text:#1A1A18; /* tell-ok: CA Design System token (dark) */
  --glass:rgba(44,44,41,.62); --glass-hi:rgba(70,70,66,.94);
  --glass-shadow:0 1px 1px rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{background:var(--canvas)}
body{margin:0;color:var(--text);font-family:var(--serif);font-size:17px;line-height:1.5;padding-inline:24px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:transparent;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round} /* stroke-ok: line icons */

/* ---------- Control layer: floats above the content on the same margins ---------- */
.page{max-width:860px;margin:0 auto;padding-bottom:132px;min-height:calc(100dvh + 1px)}
.ctl{position:fixed;top:calc(16px + env(safe-area-inset-top,0px) + var(--vvtop,0px));display:flex;gap:8px;z-index:5}
.ctl.l{left:calc(var(--side) + env(safe-area-inset-left,0px))}.ctl.r{right:calc(var(--side) + env(safe-area-inset-right,0px))}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:var(--glass-shadow);border-radius:999px}
.grp{display:flex;align-items:center;gap:2px;padding:4px}
.tb{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 12px;border-radius:999px}
/* One size for every round button: back, account */
.tb.round{width:52px;height:52px;padding:0;flex:none}
.tb.round svg.i{width:22px;height:22px}
.tb.round.av{font-weight:600;font-size:19px}
@media (hover:hover){.tb:hover{background:var(--glass-hi)}}
.tb:focus-visible{outline:none;background:var(--glass-hi)}
/* Scroll-edge fade: content passes under the controls instead of colliding with them (iOS 26 scroll edge effect) */
.edge{position:fixed;left:0;right:0;top:0;z-index:4;pointer-events:none;height:calc(76px + env(safe-area-inset-top,0px) + var(--vvtop,0px));background:linear-gradient(to bottom,var(--canvas) 30%,color-mix(in srgb,var(--canvas) 0%,transparent))}
.edge.b{top:auto;bottom:0;height:calc(84px + env(safe-area-inset-bottom,0px) + var(--kb,0px));background:linear-gradient(to top,var(--canvas) 20%,color-mix(in srgb,var(--canvas) 0%,transparent))}
.fab{position:fixed;z-index:5;right:calc(var(--side) + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px) + var(--kb,0px));width:56px;height:56px;display:grid;place-items:center;border-radius:999px;background:var(--primary-glass);color:var(--on-primary);box-shadow:var(--glass-shadow)}
.fab svg.i{width:24px;height:24px}
.fab:focus-visible{outline:none;filter:brightness(1.12)}
.search{position:fixed;z-index:5;left:calc(var(--side) + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px) + var(--kb,0px));height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;cursor:text}
.search.withfab{right:calc(var(--side) + 56px + 12px + env(safe-area-inset-right,0px))}
.search:not(.withfab){right:calc(var(--side) + env(safe-area-inset-right,0px))}
.search svg.i{color:var(--secondary)}
.search input{flex:1;min-width:0;height:100%;font-size:17px;background:transparent;border:0;outline:none;padding:0;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--secondary)}

/* ---------- Content layer: title 27, body 17, caption 15 ---------- */
.titlebar{display:flex;align-items:center;gap:12px;padding-top:92px}
.title{flex:1;min-width:0;font-size:27px;font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
.title.doct{word-break:keep-all;overflow-wrap:anywhere}
.title .sep{color:var(--secondary);font-weight:400;margin:0 .2em}
.title .nw{white-space:nowrap}
.sub{margin:6px 0 0;color:var(--secondary)}
.sub .v{color:var(--text)}
.sep2{color:var(--secondary);margin:0 .15em}
.sec{margin-top:40px}
.sh{margin:0 0 8px;font-size:15px;color:var(--secondary)}
.list{display:flex;flex-direction:column}
.row{display:grid;column-gap:14px;align-items:baseline;width:calc(100% + 24px);min-height:44px;margin:0 -12px;padding:9px 12px;border-radius:12px;text-align:left}
@media (hover:hover){button.row:hover{background:var(--current)}}
button.row:focus-visible{background:var(--current);outline:none}
.row.current{background:var(--current)}
.row>.span{grid-column:1/-1}
.t{color:var(--secondary);font-variant-numeric:tabular-nums;position:relative}
.cap{display:block;font-size:15px;line-height:1.45;color:var(--secondary);margin-top:2px}
.det{justify-self:end;text-align:right;color:var(--secondary)}
.names .nm{display:block}
.me{color:var(--text)}
.unset,.unset .cap{color:var(--danger)}
.empty{color:var(--secondary)}
.danger{color:var(--danger)}
.go{width:18px;height:18px;color:var(--caption);align-self:center;justify-self:end}
.dot{position:absolute;left:-14px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.para{margin:0;white-space:pre-line;line-height:1.7}
.ic{color:var(--secondary);align-self:center}

/* Column grids: one per kind of list, the same on every page */
.tl .row{grid-template-columns:4em minmax(0,1fr) 32px}                  /* time | what | › or delete */
.tl.ev .row{grid-template-columns:4.6em minmax(0,1fr) 32px}              /* date | event | › */
.nav .row{grid-template-columns:minmax(0,1fr) auto 32px}                 /* name | detail | › */
.nav.icons .row{grid-template-columns:22px minmax(0,1fr) auto 32px}      /* symbol | name | detail | › */
.kv .row{grid-template-columns:7em minmax(0,1fr) 32px}                   /* label | value | › or delete */
.tasks .row{grid-template-columns:8.6em minmax(0,1fr) 32px;align-items:start}  /* who | task | delete: as the Script's MC | line */
.tasks .who{display:inline}
.tasks .who svg.i{vertical-align:-1px;margin-left:2px}
.roles .row{grid-template-columns:minmax(0,1fr) auto 32px;align-items:center} /* role | holder | delete */
.people .row{grid-template-columns:32px minmax(0,1fr) 8.6em;align-items:center}  /* ○ | name | role: a fixed right column, text left-aligned */
.people.plain .row{grid-template-columns:minmax(0,1fr) 8.6em}
.people .row>:last-child{justify-self:start;text-align:left;color:var(--secondary)}
.nmb .tm{margin-left:10px;font-size:15px;color:var(--secondary);font-variant-numeric:tabular-nums}
.nmb{text-align:left;min-height:32px}
.nmb .st{margin-left:10px}
@media (hover:hover){.nmb:hover{text-decoration:underline;text-underline-offset:3px}}
.pick .row{grid-template-columns:minmax(0,1fr) 32px}
.roster .row{grid-template-columns:4.2em minmax(0,1fr) 32px;align-items:center}   /* class | name | delete */
.gu .row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px;align-items:center}
.aw .row{grid-template-columns:4.2em minmax(0,1fr) auto;align-items:center}
.aw.edit .row{grid-template-columns:32px 4.2em minmax(0,1fr) auto 32px}   /* ○ | class | name | status | delete */
.props .row{grid-template-columns:22px 10.4em minmax(0,1fr);align-items:baseline}   /* symbol | property | value, as Obsidian's properties */
.props .row .ic{align-self:start;margin-top:.2em}
.pill{white-space:nowrap}
.props .k{color:var(--secondary);white-space:nowrap}
.props .dt.none span{background:none;padding:0;margin:0}
/* On a phone the value sits under its name, so pills and long values get the full width */
@media (max-width:480px){.props .row{grid-template-columns:20px minmax(0,1fr);column-gap:12px;row-gap:4px}.props .row>:nth-child(3){grid-column:2}}
/* Several values: one pill each, × to remove, type and Return to add (Obsidian's list property) */
.pills{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;min-height:1.5em;margin-left:-10px}
.pills>.fld.pin,.pills>.empty,.pills>.who.addg{padding-left:10px}
.pill{display:inline-flex;align-items:center;gap:2px;max-width:100%;padding:1px 4px 1px 10px;border-radius:999px;background:var(--field);line-height:1.5}
.pill.ro{padding-right:10px}
.pill>button:not(.px){text-align:left}
.pill.unset>button:not(.px){color:var(--danger)}
.px{width:26px;height:26px;margin:-3px -2px -3px 0;display:grid;place-items:center;border-radius:999px;color:var(--caption)}
.px svg.i{width:14px;height:14px}
@media (hover:hover){.px:hover{color:var(--text);background:var(--current)}}
.fld.pin{flex:1;min-width:5em;width:auto}
.addg{color:var(--caption)}
.hist .row{grid-template-columns:4em minmax(0,1fr) 32px;align-items:start}
.pwl .row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px;align-items:center}
/* Deleting a thing from a list that opens it: swipe left for Delete (touch, as on iPhone); a bin on hover (mouse). Both ask first. */
.sw{position:relative;width:calc(100% + 24px);margin:0 -12px;border-radius:12px;overflow:hidden;touch-action:pan-y}
.sw>.row{position:relative;z-index:1;width:100%;margin:0;background:var(--canvas);transition:transform .2s ease}
@media (hover:hover){.sw>.row:hover{background:var(--current)}}
.sw:not(.open):not(.moving) .swdel{visibility:hidden}
.swdel{position:absolute;z-index:0;right:0;top:0;bottom:0;width:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--danger);color:var(--btn-text);font-size:13px}
.swdel svg.i{width:18px;height:18px}
.hdel{position:absolute;z-index:2;right:44px;top:0;bottom:0;height:auto;transform:none;margin:0;display:flex;align-items:center;justify-content:center;visibility:hidden}
@media (hover:hover) and (pointer:fine){.sw:hover .hdel,.hdel:focus-visible{visibility:visible}}
@media not ((hover:hover) and (pointer:fine)){.hdel{display:none}}
.sw.open .hdel{display:none}
.award h3.row{display:grid;grid-template-columns:minmax(0,1fr) 32px;align-items:center;margin:0 -12px 4px;padding:6px 12px;min-height:40px}
/* Add a row: ⊕ and what it adds, at the end of its list, starting at the list's own edge */
.row.add{display:flex;align-items:center;gap:10px;color:var(--text)}
.row.add svg.i{width:22px;height:22px;color:var(--primary)}
@media (hover:hover){.row.add:hover{background:var(--current)}}

/* ---------- Fields ----------
   In a title or a sentence (event date and name, a line's time and place): as MC Scripts' title, as wide as the text;
   empty, its name in grey on a light fill.
   In a list row (tasks, class and name, guests, teachers, roles): the cell is the field; empty, only its name in grey.
   Remarks: always a large box. */
.fld{font:inherit;color:inherit;background:transparent;border:0;outline:none;margin:0;padding:0;border-radius:8px;box-sizing:border-box;max-width:100%;min-width:0;vertical-align:baseline;-webkit-appearance:none;appearance:none}
.fld::placeholder{color:var(--caption);opacity:1}
.fld.inl{padding:0 .05em;min-width:1.5em}
.fld.inl:placeholder-shown{background:var(--field);padding:0 .35em;margin-left:-.35em}
.fld.inl:focus{background:var(--current)}
.fld.cell{width:100%}
textarea.fld{display:block;resize:none;overflow:hidden;line-height:1.5;min-height:1.5em;width:100%}
.title .fld{font-weight:600}
h3 .fld{font-weight:600}
.box{display:block;width:100%;min-height:8.5em;padding:10px 14px;border-radius:14px;background:var(--field);line-height:1.7;resize:none;overflow:hidden}
.box:focus{background:var(--current)}
.upper{text-transform:uppercase} /* tell-ok: class codes are capitals, e.g. 3C12 */
.upper::placeholder{text-transform:none}
/* A short choice: the value, a small ↕, and the system list on tap (MC Scripts' speaker picker) */
.who{position:relative;display:inline-flex;align-items:center;gap:2px;border-radius:6px;max-width:100%}
.who>span{min-width:0}
.who svg.i{width:14px;height:14px;color:var(--caption)}
.who.unset svg.i{color:var(--danger)}
.who select{position:absolute;inset:-9px -10px;width:calc(100% + 20px);height:calc(100% + 18px);opacity:0;font-size:16px;-webkit-appearance:none;appearance:none;cursor:pointer}
.who:focus-within{background:var(--current)}
.nwp{white-space:nowrap}
/* Date and time: the system picker, opened from the value itself (MC Scripts' date) */
.dt{position:relative;display:inline-flex;align-items:center;gap:2px;border-radius:6px;font-variant-numeric:tabular-nums}
.dt svg.i{width:14px;height:14px;color:var(--caption)}
.dt input{position:absolute;inset:-9px -6px;width:calc(100% + 12px);height:calc(100% + 18px);opacity:0;font-size:16px;-webkit-appearance:none;appearance:none;cursor:pointer}
.dt.none span{color:var(--caption);background:var(--field);border-radius:8px;padding:0 .35em;margin-left:-.35em}
.dt:focus-within{background:var(--current)}
/* Row actions: a 44px target sitting in a 32px column, never making its row taller */
.ib{width:44px;height:44px;margin:-10px -6px;display:grid;place-items:center;border-radius:999px;color:var(--secondary);align-self:center;justify-self:end}
@media (hover:hover){.ib:hover{background:var(--field)}}
.ib:focus-visible{background:var(--field);outline:none}
.rdel{visibility:hidden}
.row.current .rdel,.rdel:focus-visible{visibility:visible}
@media (hover:hover){.row:hover .rdel{visibility:visible}}
.tasks .rdel{align-self:start;margin-top:-10px}
/* Presence, one control everywhere (attendance and roll call): empty circle, green tick for there, red cross for absent */
.ckb{justify-self:start}
.ckb svg.i{width:24px;height:24px;color:var(--caption)}
.ckb.on svg.i{color:var(--present)}
.ckb.off svg.i{color:var(--danger)}
.st{font-size:15px;color:var(--secondary);white-space:nowrap}
.adot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.gone{color:var(--caption);text-decoration:line-through} /* stroke-ok: an absent awardee is struck out, as on the printed list */

/* ---------- Documents: the MC Scripts editor layout ---------- */
.mcline{font-weight:600;margin:10px 0 28px}
.mcline .sep2{font-weight:400}
.srow{display:grid;grid-template-columns:5.4em minmax(0,1fr) 32px;column-gap:12px;align-items:start;width:calc(100% + 24px);margin:0 -12px 6px;padding:4px 12px;border-radius:10px}
.srow .sp{font-weight:600;line-height:1.7;white-space:nowrap}
.srow .sp .who.unset{font-weight:400}
.srow .body,.srow textarea.fld{line-height:1.7}
.srow.cue .body,.srow.cue textarea{color:var(--secondary);font-size:15px}
.srow .pm{visibility:hidden;margin-top:-6px;align-self:start}
.srow.current .pm,.srow .pm:focus-visible{visibility:visible}
@media (hover:hover){.srow:hover .pm{visibility:visible}}
.srow.current{background:var(--current)}
.aws{display:grid;grid-template-columns:4.2em minmax(0,1fr);line-height:1.7}
.aws .c{font-variant-numeric:tabular-nums}
.end{text-align:center;font-style:italic;color:var(--secondary);margin:32px 0 0}
.award{margin-top:28px}
.award:first-child{margin-top:0}
.award h3{font-size:17px;font-weight:600;margin:0 0 4px;min-height:1.5em}

/* ---------- Sign in and Who Are You: a gate before the app, as MC Scripts' passcode screen ---------- */
.gate{max-width:480px;min-height:100vh;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding-block:48px}
.gate > svg.gate-i{width:52px;height:52px;stroke-width:1.4;color:var(--caption);margin-bottom:8px} /* stroke-ok: line icons */
.gate h2{margin:0;font-size:27px;font-weight:600;line-height:1.3}
.gsub{margin:0;color:var(--secondary)}
.gate form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px;margin-top:18px}
.gate input{height:50px;border:0;border-radius:14px;background:var(--field);text-align:center;outline:none;-webkit-appearance:none;appearance:none;font-size:17px}
.gate input::placeholder{color:var(--caption)}
.gate input:focus{background:var(--current)}
.gate button[type=submit]{height:50px;border-radius:14px;background:var(--primary);color:var(--on-primary);font-weight:600}
.gate .err{min-height:1.5em;margin:6px 0 0;font-size:15px}
.faces{display:flex;flex-wrap:wrap;gap:24px 12px;width:100%;margin-top:32px}
.gate .faces{justify-content:center}
.page .faces{margin-top:0}
.face{width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0;border-radius:16px}
.face .av{width:72px;height:72px;border-radius:50%;background:var(--field);display:grid;place-items:center;font-size:27px;font-weight:600}
.face[aria-pressed="true"] .av{background:var(--btn);color:var(--btn-text)}
@media (hover:hover){.face:hover .av{background:var(--current)}}
.face:focus-visible .av{background:var(--current)}
.face:focus-visible{outline:none}

/* ---------- Menus, alerts and toasts: their own layer, so showing one never rebuilds the page ---------- */
.scrim{position:fixed;inset:0;z-index:8}
.menu{position:fixed;z-index:9;min-width:220px;max-width:calc(100vw - 32px);max-height:70vh;overflow:auto;padding:6px;border-radius:18px;background:var(--glass-hi);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:var(--glass-shadow);display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px 0 12px;border-radius:12px;text-align:left;font-size:16px}
.menu button:focus-visible{background:var(--current);outline:none}
@media (hover:hover){.menu button:hover{background:var(--current)}}
.menu .lbl{flex:1}
.menu .noi,.menu svg.i{width:20px;flex:none}
.menu .ck{visibility:hidden}
.menu .on .ck{visibility:visible}
.menu .gap{height:6px}
.menu .adot{margin:0 6px}
/* A question before deleting: in the middle of the screen over a dimmed page, as Apple's alerts; a tap outside cancels */
.dim{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.36);display:grid;place-items:center;padding:24px}
.alert{width:min(320px,100%);padding:22px 18px 16px;border-radius:26px;background:var(--glass-hi);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:var(--glass-shadow);text-align:center}
.alert h2{margin:0;font-size:17px;font-weight:600;line-height:1.35}
.alert p{margin:6px 0 0;font-size:15px;color:var(--secondary)}
.alert .btns{display:flex;gap:10px;margin-top:18px}
.alert .btns button{flex:1;height:48px;border-radius:999px;background:var(--field);font-weight:600}
.alert .btns .danger{color:var(--danger)}
.alert .btns button:focus-visible{outline:none;background:var(--current)}
.toast{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px) + var(--kb,0px));display:flex;align-items:center;gap:6px;padding:4px 4px 4px 16px;font-size:15px;max-width:min(360px,calc(100vw - 32px))}
.toast .msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.plain{padding-right:16px;min-height:44px}
.toast .tb{height:36px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>

  <symbol id="i-key" viewBox="0 0 24 24"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></symbol>

  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></symbol>
  <symbol id="i-award" viewBox="0 0 24 24"><path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></symbol>
  <symbol id="i-cue" viewBox="0 0 24 24"><path d="m15 10 5 5-5 5"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/></symbol>
</svg>

<script>
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const item = (arr, id) => arr.find(x => x.id === id);

/* ---------- Groups and accounts ---------- */
// Twelve small groups. Sample rosters (fictional names and classes) only for the groups used here.
const ALL_GROUPS = ['MC', 'Backstage', 'Reception'].flatMap(m => ['A', 'B', 'C', 'D'].map(x => `${m} Group ${x}`));
let ROSTERS = {};  // from the server: the chairs keep them (Roster page)
const roster = g => ROSTERS[g] = ROSTERS[g] || {lead: {cls: '', name: ''}, people: []};
const peopleNames = g => roster(g).people.map(p => p.name).filter(Boolean);
const membersOf = g => [roster(g).lead.name, ...peopleNames(g)].filter(Boolean);
const clsOf = (g, n) => { const r = roster(g); return r.lead.name === n ? r.lead.cls : ((r.people.find(p => p.name === n) || {}).cls || ''); };
// One account per small group (members pick their name), one per Group Lead, one for the chairs, one for teachers
let CHAIRS = [];  // from the server
const ACCOUNTS = [
  {id: 'Event Lead', name: 'Event Lead', type: 'lead'}, {id: 'Teacher', name: 'Teacher', type: 'teacher'},
  ...ALL_GROUPS.map(g => ({id: g, name: g, type: 'group', group: g})),
  ...ALL_GROUPS.map(g => ({id: g + ' Lead', name: g + ' Lead', type: 'gl', group: g}))
];
const PASSWORDS = {};  // accounts whose password was set in this visit (a tick on the Passwords page)
const peopleOf = a => { const l = a.type === 'lead' ? CHAIRS : a.type === 'group' ? peopleNames(a.group) : null; return l && l.length ? l : null; };
const personOf = a => a.type === 'gl' ? roster(a.group).lead.name : '';
const OTHER = ['Off', 'Covering', 'Excluded'];  // statuses set before the day; Attended and Absent are taken at assembly
const ATTEND_COLOUR = {Attended: '#64C77B', Off: '#91BAE4', Absent: '#F49D92', Covering: '#D2B34C', Excluded: '#EDEBE3'};  // tell-ok: List of Members attendance colours (Decision Record A2)
const MC_ROLES = ['Host 1', 'Host 2', 'Writer', 'Pronunciation', 'Stage Cue', 'Backup MC'];
const DOC_OF = {MC: 'script', Backstage: 'awardees', Reception: 'guests'};
const DOC_NAME = {script: 'Script', awardees: 'Awardee List', guests: 'Guest List'};     // interface: always English
const DOC_ZH = {script: '講稿', awardees: '得獎名單', guests: '嘉賓名單'};                 // document titles in a Chinese event
const DOC_ICON = {script: 'file', awardees: 'award', guests: 'users'};
const kindOf = g => g.split(' ')[0];
// Default roles: the six 司儀 roles (Decision Record A2). Backstage and Reception defaults are still open (A6); every group can add its own.
// Default roles. 司儀: Decision Record A2. 後台 and 接待: the duties in Group Lead SOP 八 (approved by the chairs, 26/09/30).
// Any role can be removed and any group can add its own.
const DEFAULT_ROLES = {MC: MC_ROLES, Backstage: ['Roll Call', 'Props', 'Stage Reset', 'Photo Positions', 'IG Footage'], Reception: ['Check-in', 'Seating', 'Handoff', 'Send-off']};
const rolesFor = g => DEFAULT_ROLES[kindOf(g)].map(r => ({id: r, name: r, who: null}));

const blank = (id, date, name) => ({id, date, name, start: '', end: '', venue: '', leading: [], support: [], lead: '', remarks: '', groups: [], lines: [], docs: [], log: []});
let EVENTS = [];

/* ---------- Session ---------- */
const S = {acct: null, who: null, stack: [], q: '', menu: null, alert: null, toast: null, undo: null, focusKey: null, before: null, seen: {}};
let toastTimer = 0, lastKey = '', navAt = 0, downEl = null;
const A = () => ACCOUNTS.find(a => a.id === S.acct);
const cur = () => S.stack[S.stack.length - 1];
const E = () => EVENTS.find(e => e.id === (cur() && cur().ev)) || EVENTS[0];
const me = () => { const a = A(); return a.type === 'gl' ? personOf(a) : S.who; };
const touch = matchMedia('(pointer: coarse)').matches;

/* ---------- Permissions: only what the account is responsible for, and only while its group is on duty ---------- */
const onDuty = (ev, g) => ev.groups.some(x => x.name === g);
const myDocType = ev => { const a = A(); return (a.type === 'group' || a.type === 'gl') && onDuty(ev, a.group) ? DOC_OF[kindOf(a.group)] : null; };
const actingOf = ev => { const a = A(), g = a.type === 'group' && S.who && group(ev, a.group); return g && g.acting === S.who ? a.group : null; };
const glOf = ev => { const a = A(); return a.type === 'gl' && onDuty(ev, a.group) ? a.group : actingOf(ev); };  // a Group Lead on duty, or the Acting Group Lead
const can = {
  event: () => A().type === 'lead',
  roles: g => A().type === 'lead' || glOf(E()) === g,
  doc: (ev, d) => A().type === 'lead' || myDocType(ev) === d.type,
  attendance: g => A().type === 'lead' || glOf(E()) === g,
  // Two-level allocation (A1): the Event Lead gives work to groups; a Group Lead gives it to the group's roles and members
  addTask: ev => A().type === 'lead' || !!glOf(ev),
  task: (ev, t) => A().type === 'lead' || (!!glOf(ev) && !!t.to && /^[rp]:/.test(t.to) && t.to.split(':')[1] === glOf(ev)),
  export: () => A().type === 'lead'
};

/* ---------- Derived data ---------- */
const group = (ev, n) => ev.groups.find(g => g.name === n);
const sortGroups = gs => [...gs].sort((a, b) => ALL_GROUPS.indexOf(a.name) - ALL_GROUPS.indexOf(b.name));
const doc = (ev, id) => ev.docs.find(d => d.id === id);
const zh = x => /[㐀-鿿]/.test(x || '');
const W = (ev, z, e) => zh(ev.name) ? z : e;  // only document titles and document content follow the event's language
const docLabel = d => (d.q ? d.q + ' ' : '') + DOC_NAME[d.type];                       // interface
const docTitle = (ev, d) => zh(ev.name) ? (d.q || '') + DOC_ZH[d.type] : docLabel(d);   // the document's own title
const sorted = ev => ev.lines.map((l, i) => [l, i]).sort((a, b) => a[0].time.localeCompare(b[0].time) || a[1] - b[1]).map(x => x[0]);
const endOf = (ev, l) => sorted(ev).map(x => x.time).filter(t => t > l.time).sort()[0] || '';
const role = (g, id) => g && g.roles.find(r => r.id === id);
const hostsOf = g => ['Host 1', 'Host 2'].map(r => (role(g, r) || {}).who).filter(Boolean);
const taskAt = (ev, id) => { for (const l of ev.lines) { const t = item(l.tasks, id); if (t) return [l, t]; } return [null, null]; };
// Who a task is for: everyone, one group, one role, both Hosts, or one member. One owner per task (Decision Record §2).
function includes(ev, t, n) {
  if (t === 'all') return ev.groups.some(g => g.lead === n || membersOf(g.name).includes(n));
  if (!t) return false;
  const [k, gn, r] = t.split(':'); const g = group(ev, gn); if (!g) return false;
  if (k === 'g') return g.lead === n || membersOf(gn).includes(n);
  if (k === 'p') return r === n;
  return r === 'Hosts' ? hostsOf(g).includes(n) : (role(g, r) || {}).who === n;
}
function resolve(ev, t) {
  if (t === 'all') return [{txt: 'All'}];
  if (!t) return [{txt: 'Unassigned', open: true}];
  const [k, gn, r] = t.split(':'); const g = group(ev, gn);
  if (!g) return [{txt: tlabel(ev, t), open: true}];  // its group is no longer on duty
  if (k === 'g') return [{txt: gn}];
  if (k === 'p') return [{txt: r, name: r}];
  const ns = r === 'Hosts' ? hostsOf(g) : [(role(g, r) || {}).who].filter(Boolean);
  return ns.length ? ns.map(n => ({txt: n, name: n})) : [{txt: tlabel(ev, t), open: true}];
}
function tlabel(ev, t) {
  if (!t) return 'Unassigned'; if (t === 'all') return 'All';
  const [k, gn, r] = t.split(':');
  if (k === 'g') return gn; if (k === 'p' || r === 'Hosts') return r;
  return (role(group(ev, gn), r) || {}).name || 'Removed role';
}
const openCount = g => g.roles.filter(r => !r.who).length;
const snap = ev => JSON.parse(JSON.stringify({...ev, log: []}));
const now = () => new Date().toTimeString().slice(0, 5);
function logChange(ev, what, before) { ev.log.unshift({at: now(), ts: Date.now(), who: me() || A().name, acct: A().name, what, snap: before}); persistSoon(); }
const toMin = t => +t.slice(0, 2) * 60 + +t.slice(3);
const fromMin = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

/* ---------- Components: one per kind of information; every page calls these and builds no control of its own ----------
   inline field   text in a title or sentence: as wide as its text; empty, its name in grey on a light fill (MC Scripts' title)
   cell field     text in a list row: the cell is the field; empty, its name in grey
   remarks        a large box, on every page that has Remarks
   choice         the value, a small ↕, the system list (MC Scripts' speaker picker)
   date, time     the value, a small ↕, the system picker; empty, as an inline field
   add row        ⊕ and what it adds, at the end of its list; ＋ at the bottom corner only makes something with a page of its own
   presence       circle before the name: tap for there, again for absent, again to clear (attendance and roll call alike)
   delete row     a bin on the row being edited, with Undo; deleting a whole thing asks in an alert in the middle of the screen
   menu           symbol first, then words; only for two or more actions */
const ic = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const nb = h => String(h).replace(/ Group ([A-D])(?![A-Za-z])/g, ' Group&nbsp;$1');  // display text only, never attribute values
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const head = (title, sub, trail = '') => `<div class="titlebar"><h1 class="title">${title}</h1>${trail}</div>${sub ? `<p class="sub">${sub}</p>` : ''}`;
const bar = (...xs) => xs.filter(Boolean).join('<span class="sep2">｜</span>');
const evSub = ev => bar(esc(ev.date), esc(ev.name));
const listSec = (cls, rows, sh) => `<section class="sec">${sh ? `<p class="sh">${sh}</p>` : ''}<div class="list ${cls}">${rows}</div></section>`;
const emptyRow = txt => `<div class="row"><span class="span empty">${txt}</span></div>`;
const fld = (k, v, ph, cls, label) => `<input class="fld ${cls}" data-k="${k}" value="${esc(v)}" placeholder="${esc(ph || ' ')}" aria-label="${esc(label || ph)}" autocomplete="off" enterkeyhint="next">`;
const inlineFld = (k, v, ph, label) => fld(k, v, ph, 'inl', label);
const cellFld = (k, v, ph, cls = '', label) => fld(k, v, ph, 'cell ' + cls, label);
const cellArea = (k, v, ph, label) => `<textarea class="fld cell" data-k="${k}" rows="1" placeholder="${esc(ph)}" aria-label="${esc(label || ph)}" enterkeyhint="next">${esc(v)}</textarea>`;
const remarks = (k, v, edit) => `<section class="sec"><p class="sh">Remarks</p>${edit ? `<textarea class="fld box" data-k="${k}" rows="4" aria-label="Remarks">${esc(v)}</textarea>` : `<p class="para">${esc(v)}</p>`}</section>`;
const optHtml = (o, val) => `<option value="${esc(o[0])}"${o[0] === val ? ' selected' : ''}${o[2] ? ' disabled' : ''}>${esc(o[1])}</option>`;
const picker = (k, val, shown, opts, unsetText, label, quiet) => `<label class="who${val ? '' : quiet ? ' empty' : ' unset'}"><span>${nb(esc(val ? shown : unsetText))}</span>${ic('updown')}<select data-k="${k}" aria-label="${esc(label || unsetText)}">${val ? '' : '<option value="" selected disabled></option>'}${opts.map(o => o.group ? `<optgroup label="${esc(o.group)}">${o.items.map(x => optHtml(x, val)).join('')}</optgroup>` : optHtml(o, val)).join('')}</select></label>`;
const timeCtl = (k, v, label) => `<label class="dt${v ? '' : ' none'}"><span>${esc(v || label)}</span><input type="time" step="300" data-k="${k}" value="${esc(v)}" aria-label="${esc(label)}"></label>`;
const toIso = d => /^\d\d\/\d\d\/\d\d$/.test(d) ? '20' + d.replace(/\//g, '-') : '';
const fromIso = s => s ? s.slice(2).replace(/-/g, '/') : '';
const dateCtl = (k, v) => `<label class="dt${v ? '' : ' none'}"><span>${esc(v || 'Date')}</span><input type="date" data-k="${k}" value="${toIso(v)}" aria-label="Date"></label>`;
const ibtn = (icon, act, label, cls = '') => `<button class="ib ${cls}" data-act="${act}" type="button" aria-label="${esc(label)}">${ic(icon)}</button>`;
const rdel = (act, label) => ibtn('trash', act, label, 'rdel');
const swRow = (rowHtml, act, label) => act ? `<div class="sw">${rowHtml}<button class="ib hdel" data-act="${act}" type="button" aria-label="${esc(label)}">${ic('trash')}</button><button class="swdel" data-act="${act}" type="button" tabindex="-1" aria-hidden="true">${ic('trash')}<span>Delete</span></button></div>` : rowHtml;
const addRow = (act, label) => `<button class="row add" data-act="${act}" type="button">${ic('plus-c')}<span>${label}</span></button>`;
const presence = (act, on, name) => `<button class="ib ckb${on ? ' on' : ''}" data-act="${act}" type="button" aria-pressed="${on}" aria-label="${esc(name)} is here">${ic(on ? 'check-fill' : 'circle')}</button>`;
// Roll call: once anyone on the list is ticked, everyone not ticked counts as absent (the chairs: not ticked = absent)
const called = d => d.awards.some(aw => aw.rows.some(r => r.here === 'Present'));
const absent = (d, r) => called(d) && r.here !== 'Present';
// Several values as pills (Obsidian's list property). key names the list; values are strings.
const pills = (key, values, ph, edit) => `<span class="pills">${values.map((v, i) => `<span class="pill${edit ? '' : ' ro'}"><span>${esc(v)}</span>${edit ? `<button class="px" data-act="unpill:${key}:${i}" type="button" aria-label="Remove ${esc(v)}">${ic('x')}</button>` : ''}</span>`).join('')}${edit ? `<input class="fld cell pin" data-pill="${key}" placeholder="${esc(ph)}" aria-label="Add ${esc(ph)}" autocomplete="off" enterkeyhint="done">` : ''}</span>`;
const chev = ic('chev-r', 'go');
const namesHtml = (ev, t) => resolve(ev, t).map(x => `<span class="nm${x.open ? ' unset' : ''}${x.name && x.name === me() ? ' me' : ''}">${nb(esc(x.txt))}</span>`).join('');
const faces = (names, act) => `<div class="faces">${names.map(n => `<button class="face" data-act="${act}:${esc(n)}" type="button" aria-pressed="${n === S.who}"><span class="av">${esc([...n][0] || '')}</span><span>${esc(n)}</span></button>`).join('')}</div>`;

/* ---------- Pages: one job, one kind of thing each ---------- */
function pSignIn() {
  return {page: 'signin', body: `<div class="gate">${ic('key', 'gate-i')}<h2>Sign In</h2>
    <form id="signin"><input id="acct" aria-label="Account" placeholder="Account" autocomplete="username" autocapitalize="words" autocorrect="off" spellcheck="false">
    <input id="pw" type="password" aria-label="Password" placeholder="Password" autocomplete="current-password">
    <button type="submit">Sign In</button></form><p class="err danger" role="alert"></p></div>`};
}
function pLoading() { return {page: 'loading', body: `<div class="gate">${ic('clock', 'gate-i')}<h2>Loading</h2><p class="gsub">${SYNC.offline ? 'No connection yet' : ''}</p></div>`}; }
function pWho() {
  const a = A();
  return {page: 'who', body: `<div class="gate"><h2>Who Are You?</h2><p class="gsub">${esc(a.name)}</p>${faces(peopleOf(a), 'be')}</div>`};
}
function pAccount() {
  const a = A();
  let h = head(esc(a.name), peopleOf(a) ? '' : me() ? esc(me()) : '');
  if (peopleOf(a)) h += `<section class="sec"><p class="sh">Switch Person</p>${faces(peopleOf(a), 'be')}</section>`;
  if (a.type === 'lead') h += listSec('nav icons', `<button class="row" data-act="roster">${ic('users', 'ic')}<span>Roster</span><span></span>${chev}</button><button class="row" data-act="passwords">${ic('key', 'ic')}<span>Passwords</span><span></span>${chev}</button>`);

/* ---------- Server: sign-in, loading and saving ----------
   Every event is one record on the server. The page saves an event a moment after it changes; if someone else saved
   the same event in between, the server answers with their version, and the two are merged piece by piece (a Rundown
   line, a task, a document, a group) before saving again. The device keeps a copy, so the page opens without a
   connection and uploads its changes when back online. */

  set: (k, v) => { try { localStorage.setItem('ev:' + k, JSON.stringify(v)); } catch (e) {} },
  del: k => { try { localStorage.removeItem('ev:' + k); } catch (e) {} }

}
const isBlank = ev => !ev.name.trim() && !ev.date && !ev.lines.length && !ev.groups.length && !ev.docs.length;
const sortEvents = () => EVENTS.sort((a, b) => (!a.date) - (!b.date) || b.date.localeCompare(a.date));
function cacheSave() {
  if (!S.acct) return;
  store.set('cache', {acct: S.acct, events: EVENTS, base: SYNC.base, rev: SYNC.rev, seq: SYNC.seq, rosters: ROSTERS, chairs: CHAIRS, rosterBase: SYNC.rosterBase});
  store.set('seen', S.seen);
}
function cacheLoad() {
  const c = store.get('cache');
  if (!c || c.acct !== S.acct) return false;
  EVENTS = c.events || []; SYNC.base = c.base || {}; SYNC.rev = c.rev || {}; SYNC.seq = c.seq || 0;
  ROSTERS = c.rosters || {}; CHAIRS = c.chairs || []; SYNC.rosterBase = c.rosterBase || JSON.stringify(ROSTERS);
  return true;
}
// Rebuild the page with new data, but never under the fingers of someone typing or choosing
function refresh() {
  const a = document.activeElement;
  if (S.menu || S.alert || (a && app.contains(a) && a.matches('input,textarea,select'))) { SYNC.pending = true; return; }
  render();
}
document.addEventListener('focusout', () => { if (SYNC.pending) setTimeout(() => { if (SYNC.pending) { SYNC.pending = false; refresh(); } }, 200); });

// ---- Merging: whoever changed a piece keeps their change; if both changed the same piece, this device's wins ----
const J = x => JSON.stringify(x === undefined ? null : x);
const pick = (b, m, t) => J(m) === J(b) ? t : m;
function mergeList(b, m, t, key, deep) {
  b = b || []; m = m || []; t = t || [];
  const bi = new Map(b.map(x => [x[key], x])), mi = new Map(m.map(x => [x[key], x])), ti = new Map(t.map(x => [x[key], x]));
  const out = [];
  [...m.map(x => x[key]), ...t.map(x => x[key]).filter(id => !mi.has(id))].forEach(id => {
    const B = bi.get(id), M = mi.get(id), T = ti.get(id);
    if (M && T) out.push(deep ? deep(B, M, T) : pick(B, M, T));
    else if (M) { if (!B || J(M) !== J(B)) out.push(M); }      // they deleted it: gone, unless this device changed it
    else if (T && !B) out.push(T);                               // they added it
  });
  return out;
}
function mergeObj(B, M, T, special = {}) {
  const o = {};
  new Set([...Object.keys(M), ...Object.keys(T)]).forEach(k => { o[k] = special[k] ? special[k](B && B[k], M[k], T[k]) : pick(B && B[k], M[k], T[k]); });
  return o;
}
function merge3(b, m, t) {
  const perGroup = (B, M, T) => { const x = {}; new Set([...Object.keys(M || {}), ...Object.keys(T || {})]).forEach(g => { x[g] = pick((B || {})[g], (M || {})[g], (T || {})[g]); }); return x; };
  return mergeObj(b || {}, m, t, {
    lines: (B, M, T) => mergeList(B, M, T, 'id', (b2, m2, t2) => mergeObj(b2, m2, t2, {tasks: (B3, M3, T3) => mergeList(B3, M3, T3, 'id'), v: (x, y, z) => Math.max(y || 0, z || 0)})),
    docs: (B, M, T) => mergeList(B, M, T, 'id'),
    groups: (B, M, T) => mergeList(B, M, T, 'name', (b2, m2, t2) => mergeObj(b2, m2, t2)),
    attendance: perGroup, attTime: perGroup,
    log: (B, M, T) => { const seen = new Set(); return [...(M || []), ...(T || [])].filter(e => { const id = (e.ts || e.at) + '|' + e.who + '|' + e.what; if (seen.has(id)) return false; seen.add(id); return true; }).sort((x, y) => (y.ts || 0) - (x.ts || 0)); }
  });
}
function replaceIn(target, src) { Object.keys(target).forEach(k => delete target[k]); Object.assign(target, src); }

// ---- Loading ----
function apply(rows) {
  let changed = false;
  rows.forEach(row => {
    SYNC.seq = Math.max(SYNC.seq, row.rev);
    if (SYNC.busy.has(row.id) || (SYNC.rev[row.id] || 0) >= row.rev) return;   // a save in flight is merged when it returns
    const i = EVENTS.findIndex(e => e.id === row.id), local = EVENTS[i];
    const clean = local && JSON.stringify(local) === SYNC.base[row.id];
    if (row.deleted) { if (local && clean) { EVENTS.splice(i, 1); changed = true; } delete SYNC.base[row.id]; SYNC.rev[row.id] = row.rev; return; }
    const theirs = JSON.parse(row.data);
    if (!local) EVENTS.push(theirs);
    else if (clean) replaceIn(local, theirs);
    else { replaceIn(local, merge3(SYNC.base[row.id] ? JSON.parse(SYNC.base[row.id]) : null, local, theirs)); persistSoon(100); }
    SYNC.base[row.id] = row.data; SYNC.rev[row.id] = row.rev; changed = true;
  });
  if (changed) { sortEvents(); cacheSave(); }
  return changed;
}
async function loadAll() {
  try {
    const r = await api('state?since=0&full=1'), b = await r.json();
    if (!r.ok) throw new Error(b.error);
    const rosterDirty = SYNC.rosterBase && JSON.stringify(ROSTERS) !== SYNC.rosterBase;
    if (!rosterDirty) { ROSTERS = b.rosters || {}; SYNC.rosterBase = JSON.stringify(ROSTERS); }
    CHAIRS = b.chairs || [];
    apply(b.rows);
    // An event this device knew that the server no longer has at all: keep only if it has unsent changes
    const onServer = new Set(b.rows.map(x => x.id));
    EVENTS = EVENTS.filter(ev => onServer.has(ev.id) || SYNC.base[ev.id] === undefined);
    SYNC.offline = false;
    const first = !SYNC.loaded; SYNC.loaded = true; cacheSave();
    if (first && !S.stack.length) { if (peopleOf(A()) && !S.who) render(); else land(); } else refresh();
  } catch (e) {
    if (String(e.message) === 'signin') return;
    SYNC.offline = true;
    if (!SYNC.loaded) render();
    setTimeout(loadAll, 8000);
  }
}
async function pull() {
  if (!SYNC.token || !SYNC.loaded || document.hidden) return;
  try {
    const r = await api('state?since=' + SYNC.seq); if (!r.ok) return;
    const b = await r.json(); SYNC.offline = false;
    if (apply(b.rows)) refresh();
  } catch (e) { SYNC.offline = true; }
}
setInterval(pull, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { pull(); persist(); } });
window.addEventListener('online', () => { persist(); pull(); });

// ---- Saving ----
function persistSoon(ms = 600) { clearTimeout(SYNC.timer); SYNC.timer = setTimeout(persist, ms); }
function persist() {
  if (!SYNC.token || !SYNC.loaded) return;
  store.set('seen', S.seen);
  Object.keys(SYNC.base).forEach(id => { if (!EVENTS.some(e => e.id === id) && !SYNC.busy.has(id)) push(id, null); });
  EVENTS.forEach(ev => {
    const s = JSON.stringify(ev);
    if (s !== SYNC.base[ev.id] && !SYNC.busy.has(ev.id) && !(SYNC.base[ev.id] === undefined && isBlank(ev))) push(ev.id, s);
  });
  if (A() && A().type === 'lead' && SYNC.rosterBase && JSON.stringify(ROSTERS) !== SYNC.rosterBase && !SYNC.busy.has('rosters')) pushRosters();
  cacheSave();
}
async function push(id, s) {
  SYNC.busy.add(id);
  let again = 0;
  try {
    const r = await api('events/' + id, {method: 'PUT', body: JSON.stringify(s === null ? {rev: SYNC.rev[id] || 0, deleted: true} : {rev: SYNC.rev[id] || 0, data: s})});
    const b = await r.json().catch(() => ({}));
    const local = EVENTS.find(e => e.id === id);
    if (r.ok) {
      SYNC.rev[id] = b.rev; SYNC.seq = Math.max(SYNC.seq, b.rev);
      if (s === null) delete SYNC.base[id];
      else { SYNC.base[id] = b.data; if (local && JSON.stringify(local) === s) replaceIn(local, JSON.parse(b.data)); }
      SYNC.offline = false;
    } else if (r.status === 409) {
      SYNC.rev[id] = b.rev;
      if (b.deleted || !b.data) {
        if (s === null) delete SYNC.base[id];
        else if (b.deleted) { delete SYNC.base[id]; if (local) { EVENTS.splice(EVENTS.indexOf(local), 1); toast('This event was deleted on another device'); refresh(); } }
      } else {
        const theirs = JSON.parse(b.data);
        if (local) replaceIn(local, merge3(SYNC.base[id] ? JSON.parse(SYNC.base[id]) : null, local, theirs));
        SYNC.base[id] = b.data; again = 50; refresh();
      }
    } else if (r.status === 403) {
      // Something this account may not change: go back to the saved version
      if (local && SYNC.base[id]) replaceIn(local, JSON.parse(SYNC.base[id]));
      else if (local && s !== null) EVENTS.splice(EVENTS.indexOf(local), 1);
      toast('Only those responsible can change that'); refresh();
    } else again = 5000;
  } catch (e) {
    if (String(e.message) !== 'signin') { SYNC.offline = true; again = 6000; }
  } finally {
    SYNC.busy.delete(id); cacheSave();
    if (again) persistSoon(again);
  }
}
async function pushRosters() {
  SYNC.busy.add('rosters');
  const text = JSON.stringify(ROSTERS);
  try { const r = await api('rosters', {method: 'PUT', body: text}); if (r.ok) SYNC.rosterBase = text; else persistSoon(6000); }
  catch (e) { persistSoon(6000); }
  finally { SYNC.busy.delete('rosters'); cacheSave(); }
}
async function loadAccounts() {
  try { const r = await api('accounts'); if (!r.ok) return; const b = await r.json(); b.accounts.forEach(a => { if (a.changed) PASSWORDS[a.id] = true; }); if (cur() && cur().p === 'passwords') refresh(); } catch (e) {}
}

// ---- Signing out ----
function signedOut(msg) {
  SYNC.token = null; SYNC.loaded = false; SYNC.base = {}; SYNC.rev = {}; SYNC.seq = 0; SYNC.rosterBase = '';
  store.del('token'); store.del('acct'); store.del('who'); store.del('cache');
  EVENTS = []; ROSTERS = {}; CHAIRS = []; S.acct = null; S.who = null; S.stack = []; S.menu = null; S.alert = null;
  render(); if (msg) toast(msg);
}
function signOut() {
  const t = SYNC.token;
  if (t) fetch('/api/logout', {method: 'POST', headers: {authorization: 'Bearer ' + t}}).catch(() => {});
  signedOut();
}

// ---- Start: the last account on this device, its copy of the events, then the server ----
// An MC Scripts join link from before the events page (…/#k=passcode) still opens MC Scripts
if (/^#k=/.test(location.hash)) location.replace('/scripts' + location.hash);
SYNC.token = store.get('token'); S.acct = store.get('acct'); S.who = store.get('who'); S.seen = store.get('seen') || {};
if (SYNC.token && S.acct && ACCOUNTS.some(a => a.id === S.acct)) {
  if (cacheLoad()) { SYNC.loaded = true; S.stack = [{p: 'events'}]; }
  render(); loadAll();
} else { SYNC.token = null; S.acct = null; render(); }

</script>
