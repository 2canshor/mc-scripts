<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MC Scripts">
<meta name="robots" content="noindex">
<title>MC Scripts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap">
<!-- Icons: Lucide (ISC licence), https://lucide.dev -->
<style>
:root{
  --canvas:#FBFAF7; /* tell-ok: CA Design System token */
  /* CA Design System: neutrals carry the page; Strong Yellow, the CA accent, is the primary action colour; Text Yellow marks what still needs filling */
  --current:#F1EFE8; --field:#EDEBE3; --fill:#6E5916; --primary:#BAA877; --on-primary:#1A1A18;
  /* Tinted glass: the accent, slightly see-through, with light falling on its upper half */
  --primary-glass:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.06) 55%,rgba(255,255,255,0)),color-mix(in srgb,var(--primary) 84%,transparent);
  --text:#1A1A18; /* tell-ok: CA Design System token */
  --secondary:#6B6A64; --caption:#85837C; --faint:#85837C;
  --danger:#9A3B2E; --btn:#1A1A18; --btn-text:#FBFAF7; /* tell-ok: CA Design System token */
  --glass:rgba(255,255,255,.62); --glass-hi:rgba(255,255,255,.9); --glass-sel:rgba(26,26,24,.9);
  --glass-shadow:0 1px 1px rgba(26,26,24,.04),0 8px 28px rgba(26,26,24,.12);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
  --pt:1.5455px;
  /* Where the content column starts; floating controls line up with it on wide screens */
  --side:max(16px, calc((100vw - 860px) / 2));
  /* Where both pages' titles start: 32px below the floating controls (16 + 48) */
  --top:96px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --canvas:#1C1C1A; --current:#262623; --field:#2E2D2A; --fill:#BAA877;
    --text:#F2F0EA; /* tell-ok: CA Design System token (dark) */
    --secondary:#B0AEA5; --caption:#8E8D87; --faint:#8E8D87;
    --danger:#E59A8C; --btn:#F2F0EA; --btn-text:#1A1A18; /* tell-ok: CA Design System token (dark) */
    --glass:rgba(44,44,41,.62); --glass-hi:rgba(70,70,66,.9); --glass-sel:rgba(242,240,234,.92);
    --glass-shadow:0 1px 1px rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#1C1C1A; --current:#262623; --field:#2E2D2A; --fill:#BAA877;
  --text:#F2F0EA; /* tell-ok: CA Design System token (dark) */
  --secondary:#B0AEA5; --caption:#8E8D87; --faint:#8E8D87;
  --danger:#E59A8C; --btn:#F2F0EA; --btn-text:#1A1A18; /* tell-ok: CA Design System token (dark) */
  --glass:rgba(44,44,41,.62); --glass-hi:rgba(70,70,66,.9); --glass-sel:rgba(242,240,234,.92);
  --glass-shadow:0 1px 1px rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--canvas)}
body{margin:0;color:var(--text);font-family:var(--serif);font-size:17px;line-height:1.6;padding-inline:16px;padding-block:0 120px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.3;cursor:default}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round} /* stroke-ok: line icons */

/* Control layer: one floating toolbar; content scrolls beneath it behind a scroll-edge fade */
.edge{position:fixed;top:0;right:0;z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) calc(var(--side) + env(safe-area-inset-right,0px)) 0 0;pointer-events:none}
.toolbar{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;pointer-events:none}
.glass{pointer-events:auto;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);box-shadow:var(--glass-shadow);border-radius:999px}
.group{display:flex;align-items:center;gap:2px;padding:4px}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;padding:0 12px;border-radius:999px;font-size:15px;color:var(--text)}
.tb:hover:not(:disabled){background:var(--glass-hi)}
.tb[aria-pressed="true"]{background:var(--glass-sel);color:var(--btn-text)}
.tb.prominent{background:var(--btn);color:var(--btn-text);font-weight:600;padding:0 18px;height:48px}
.tb:focus-visible{background:var(--glass-hi);outline:none}
.tb.prominent:focus-visible{opacity:.85}
@media (max-width:640px){.t-label{display:none}}

/* Back to the script list: leading edge */
.lead{position:fixed;top:0;left:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(16px + env(safe-area-inset-top,0px)) 0 0 calc(var(--side) + env(safe-area-inset-left,0px));pointer-events:none}
.lead #back{width:52px;height:52px;padding:0}
.lead #back svg.i{width:22px;height:22px}

/* Views: the script list, or one script */
body[data-view="list"] .doc,body[data-view="list"] .edge,body[data-view="list"] .lead{display:none}
body[data-view="doc"] .lib{display:none}
.lib{max-width:860px;margin:0 auto;padding-top:48px}
/* Two text styles only: the page title, and one body size for everything in the list.
   Hierarchy comes from order, position, space and colour, not from more sizes and weights. */
.lib h1{font-size:34px;font-weight:700;line-height:1.2;margin:0 0 12px}
.lib .count{margin:0;font-size:17px;color:var(--secondary)}
/* The list: plain rows grouped by when the event is, no cards (easier to scan than a pile of boxes) */
.lib .section+.section{margin-top:24px}
.lib .sh{display:flex;align-items:center;gap:4px;min-height:44px;padding:0;font-size:17px;color:var(--secondary);cursor:pointer;text-align:left}
.lib .sh svg.i{width:16px;height:16px;transition:transform .2s ease}
.lib .sh[aria-expanded="false"] svg.i{transform:rotate(-90deg)}
.lib ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lib li{display:flex;align-items:center;margin:0 -12px;border-radius:12px}
.lib li:hover,.lib li:focus-within,.lib li.held{background:var(--current)}
.lib .item{flex:1;min-width:0;display:flex;align-items:baseline;gap:16px;min-height:48px;padding:12px;text-align:left;font-size:17px;line-height:1.4;border-radius:12px;outline:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.lib .when{flex:none;width:5.2em;color:var(--secondary);font-variant-numeric:tabular-nums}
.lib .t{flex:none;max-width:60%;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib .mcs{flex:1;min-width:0;color:var(--secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.lib .mcs{display:none}}
.lib .rowmore{flex:none;width:44px;height:44px;margin-right:4px;display:grid;place-items:center;border-radius:999px;color:var(--secondary)}
.lib .rowmore:hover,.lib .rowmore:focus-visible,.lib .rowmore[aria-expanded="true"]{background:var(--field);color:var(--text);outline:none}
.lib .emptystate{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.lib .emptystate svg.i{width:52px;height:52px;stroke-width:1.4;color:var(--caption);margin-bottom:8px} /* stroke-ok: line icons */
.lib .emptystate h2{margin:0;font-size:20px;font-weight:600}
.lib .emptystate p{margin:0;font-size:15px;color:var(--secondary)}
.lib .t.untitled{color:var(--caption)}

/* Search: a glass field in the control layer, bottom leading, level with the add button */
.search{position:fixed;z-index:20;left:calc(var(--side) + env(safe-area-inset-left,0px));right:calc(var(--side) + 56px + 12px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px) + var(--kb,0px));height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;cursor:text}
.search svg.i{color:var(--secondary)}
.search input{flex:1;min-width:0;height:100%;font:inherit;font-size:17px;color:var(--text);background:transparent;border:0;outline:none;padding:0;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--secondary)}
body:not([data-view="list"]) .search,body.noscripts .search{display:none}
.lib .nomatch{margin:40px 0 0;text-align:center;color:var(--secondary);font-size:15px}

/* Add button: floats at the bottom trailing corner */
.fab{position:fixed;z-index:20;right:calc(var(--side) + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px) + var(--kb,0px));width:56px;height:56px;display:grid;place-items:center;color:var(--text)}
.fab svg.i{width:24px;height:24px}
.fab:not([aria-disabled="true"]){background:var(--primary-glass);color:var(--on-primary)}
.fab[aria-disabled="true"]{opacity:.3}
.fab:hover:not([aria-disabled="true"]){filter:brightness(1.08)}
.fab:focus-visible{outline:none;filter:brightness(1.15)}
.fab svg.i{transition:transform .2s ease}
.fab[aria-expanded="true"],.tb[aria-expanded="true"]{background:var(--primary-glass);color:var(--on-primary)}
.fab[aria-expanded="true"] svg.i{transform:rotate(45deg)}

/* Menus and toast: also control layer */
.menu{position:fixed;z-index:30;min-width:220px;padding:6px;border-radius:18px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font-size:16px;text-align:left}
.menu button:hover:not(:disabled),.menu button:focus-visible{background:var(--glass-hi);outline:none}
.menu .danger{color:var(--danger)}
.menu .label{flex:1}
.menu button svg.i:last-child:not(:first-child){color:var(--text)}
.menu .gap{height:6px}
.toast{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px + var(--vvtop,0px));display:flex;align-items:center;gap:6px;padding:4px 4px 4px 16px;font-size:15px;max-width:min(300px,calc(100vw - 32px))}
@media (max-width:760px){.toast{top:calc(env(safe-area-inset-top,0px) + 66px + var(--vvtop,0px))}}
.toast.plain{padding-right:16px;min-height:44px}
.toast .msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .msg.link{text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.toast.bad .msg{color:var(--danger)}
.toast .tb{height:36px}

/* Joining the shared scripts: a passcode, once per iPad */
body[data-view="join"]{padding-bottom:0}
.join{display:none;max-width:420px;min-height:100vh;min-height:100dvh;margin:0 auto;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
body[data-view="join"] .join{display:flex}
body[data-view="join"] .lib,body[data-view="join"] .doc,body[data-view="join"] .edge,body[data-view="join"] .lead,body[data-view="join"] .fab{display:none}
.join svg.i{width:52px;height:52px;stroke-width:1.4;color:var(--caption);margin-bottom:8px} /* stroke-ok: line icons */
.join h2{margin:0;font-size:20px;font-weight:600}
.join form{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:18px}
.join input{font:inherit;font-size:18px;height:50px;border:0;border-radius:14px;background:var(--field);color:var(--text);text-align:center;outline:none;-webkit-appearance:none;appearance:none}
.join input::placeholder{color:var(--caption)}
.join input:focus{background:var(--current)}
.join button{height:50px;border-radius:14px;background:var(--primary);color:var(--on-primary);font-weight:600}
.join .err{min-height:1.6em;margin:0;font-size:15px;color:var(--danger)}

/* Content layer: the script itself, laid out as it will print */
.doc{max-width:860px;margin:0 auto}
/* Inline fields: standard inputs (reliable with iPad Chinese input), sized to their text */
.fld{font:inherit;font-weight:inherit;color:inherit;background:transparent;border:0;outline:none;margin:0;padding:0 .05em;box-sizing:content-box;border-radius:8px;max-width:100%;min-width:2em;vertical-align:baseline;-webkit-appearance:none;appearance:none}
.fld::placeholder{color:var(--caption)}
.fld:placeholder-shown,.date.empty{background:var(--field);padding:0 .35em;border-radius:8px}
.title .date.empty,.mcline .mc:first-child .hit:first-child .fld:placeholder-shown{margin-left:-.35em}
.fld:focus{background:var(--current)}
.title .fld,.mcline .fld{font-weight:600}
.hit{display:inline-block;padding:9px 0;margin:-9px 0;cursor:text}
.title{font-size:calc(20 * var(--pt));font-weight:600;line-height:1.3;margin:0 0 16px;padding:var(--top) 0 0;text-wrap:balance}
.title .sep{color:var(--secondary);margin:0 .15em}
.date{position:relative;display:inline-block;border-radius:6px}
.date input{position:absolute;left:0;top:-9px;width:100%;height:calc(100% + 18px);opacity:0;font-size:16px;-webkit-appearance:none;appearance:none;cursor:pointer}
.date .ph{color:var(--caption)}
.date:focus-within{background:var(--current)}
.mcline{font-size:calc(12 * var(--pt));font-weight:600;margin:0 0 calc(24 * var(--pt));display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 0}
.mcline .mc{display:inline-flex;gap:.2em;align-items:baseline}
.mcline .dot{color:var(--secondary);margin:0 .3em}
.upper{text-transform:uppercase} /* tell-ok: class codes are capitals, e.g. 3C12 */
.upper::placeholder{text-transform:none}
/* Something still to fill: its prompt turns Text Yellow, like the 填寫 lines in CA files */
.needs{background:var(--field)!important}
.needs,.needs::placeholder,.needs .ph,.needs textarea::placeholder,.needs input::placeholder,.needs .who{color:var(--fill)!important}
.row{cursor:text;display:grid;grid-template-columns:var(--ind) minmax(0,1fr) 40px;margin-inline:-10px;padding:4px 10px;border-radius:10px}
/* Each paragraph's own ⋯, at its end: shown on the paragraph being edited (and on hover), space kept so text never shifts */
.bmore{grid-column:3;grid-row:1;align-self:start;justify-self:end;width:44px;height:44px;margin:-10px -6px -10px 0;display:grid;place-items:center;border-radius:999px;color:var(--secondary);opacity:0;pointer-events:none}
.row.current .bmore,.row:hover .bmore,.bmore:focus-visible,.bmore[aria-expanded="true"]{opacity:1;pointer-events:auto}
.bmore:hover,.bmore:focus-visible,.bmore[aria-expanded="true"]{background:var(--field);color:var(--text);outline:none}
.row.current{background:var(--current)}
.row textarea{grid-column:2;font:inherit;color:inherit;background:transparent;border:0;outline:none;resize:none;overflow:hidden;padding:0;margin:0;width:100%;min-height:1.6em;line-height:1.6;display:block}
.row textarea::placeholder{color:var(--caption)}
.row.cue textarea{font-size:calc(9 * var(--pt));color:var(--secondary)}
.awards{grid-column:2;display:flex;flex-direction:column}
.aw{display:grid;grid-template-columns:calc(80 * var(--pt)) minmax(0,1fr)}
.aw input{font:inherit;color:inherit;background:transparent;border:0;outline:none;padding:0;margin:0;width:100%;min-width:0;line-height:1.6;height:1.6em;border-radius:4px}
.aw input::placeholder{color:var(--caption)}
/* A class that repeats the row above is not printed, so it is not shown either, until the row is being edited */
.aw input.repeat:not(:focus){color:transparent}
.aw input:focus{background:var(--canvas)}
.who{position:relative;align-self:start;display:inline-flex;align-items:center;gap:2px;font-weight:600;height:1.6em;width:max-content;max-width:100%;border-radius:6px}
.who.faint{color:var(--faint)}
.who.unset{color:var(--danger);font-weight:400}
.who select{position:absolute;inset:-9px -10px;width:calc(100% + 20px);height:calc(100% + 18px);opacity:0;font-size:16px;-webkit-appearance:none;appearance:none;cursor:pointer}
.who svg.i{width:14px;height:14px;color:var(--caption)}
.who:focus-within{background:var(--current)}
/* The script fills at least the window, so {End of Script} rests at the bottom, as on the printed page */
.doc{display:flex;flex-direction:column;min-height:calc(100vh - 120px);min-height:calc(100dvh - 120px)}
.end{text-align:center;font-style:italic;color:var(--secondary);margin:auto 0 0;padding-top:calc(16 * var(--pt))}
@media (max-width:640px){:root{--pt:1.3636px}body{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="lead">
  <button type="button" class="tb glass" id="back" aria-label="講稿列表" title="講稿列表"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-back"/></svg></button>
  <div class="glass group" role="group" aria-label="還原及重做">
    <button type="button" class="tb" id="undo" aria-label="還原" title="還原" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-undo"/></svg></button>
    <button type="button" class="tb" id="redo" aria-label="重做" title="重做" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-redo"/></svg></button>
  </div>
</div>

<div class="edge">
  <div class="toolbar" role="toolbar" aria-label="講稿工具">
    <div class="glass group">
      <button type="button" class="tb" id="share" aria-label="分享講稿" title="分享講稿"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-share"/></svg></button>
      <button type="button" class="tb" id="more" aria-label="更多" title="更多" aria-haspopup="menu" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-more"/></svg></button>
    </div>
  </div>
</div>

<section class="lib" aria-label="講稿列表">
  <h1>講稿</h1>
  <p class="count" id="libcount"></p>
  <div id="liblist"></div>
  <p class="nomatch" id="nomatch" hidden>沒有相符的講稿</p>
  <div class="emptystate" id="libempty" hidden>
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-doc"/></svg>
    <h2>未有講稿</h2>
    <p>按加號新增講稿</p>
  </div>
</section>

<section class="join" aria-label="加入">
  <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-key"/></svg>
  <h2>輸入 CA 密碼</h2>
  <form id="joinform">
    <input id="code" aria-label="密碼" placeholder="密碼" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button type="submit">加入</button>
  </form>
  <p class="err" id="joinerr" role="alert"></p>
</section>

<main class="doc" id="doc" aria-label="講稿">
  <h1 class="title">
    <label class="date" id="date-wrap"><span id="date-text"></span><input type="date" id="date" aria-label="日期"></label><span class="sep">｜</span><label class="hit"><input class="fld" id="event" aria-label="活動名稱" placeholder="活動名稱" autocomplete="off" enterkeyhint="done"></label><span class="sep">｜</span><span id="doc-type">講稿</span>
  </h1>
  <div class="mcline" id="mcline" aria-label="司儀"></div>
  <div id="rows"></div>
  <p class="end">{End of Script}</p>
</main>

<label class="search glass" id="searchbar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg><input id="q" type="search" placeholder="搜尋" aria-label="搜尋講稿" autocomplete="off" enterkeyhint="search"></label>

<button type="button" class="fab glass" id="insert" aria-label="加" title="加" aria-haspopup="menu" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg></button>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></symbol>

<script>
/* MC Scripts: state -> one layout -> Word document.xml and the on-screen preview.
   Word package and styles come from the CA Cantonese Script Template. */
var ScriptGen = (function () {
  var GAP_BLOCK = 240, GAP_TIGHT = 120, GAP_NONE = 0; // twips after a paragraph

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function isWide(ch) {
    var c = ch.codePointAt(0);
    return (c >= 0x1100 && c <= 0x115f) || (c >= 0x2e80 && c <= 0xa4cf) || (c >= 0xac00 && c <= 0xd7a3) ||
      (c >= 0xf900 && c <= 0xfaff) || (c >= 0xfe30 && c <= 0xfe4f) || (c >= 0xff00 && c <= 0xff60) || (c >= 0x20000);
  }
  // Rough width in twips at 11 pt: full-width 220, others about 125.
  function twips(s) {
    var w = 0;
    for (var ch of String(s)) w += isWide(ch) ? 220 : 125;
    return w;
  }
  function yymmdd(d, sep) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || "");
    return m ? m[1].slice(2) + sep + m[2] + sep + m[3] : "";
  }
  function lines(text) {
    return String(text || "").split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
  }
  function cls(s) { return String(s || "").trim().toUpperCase(); }
  // English scripts label an MC by first name ("Tai Man Chan" -> "Tai"), as in the English template.
  function mcLabel(mc) {
    var n = (mc.name || "").trim();
    if (mc.label && mc.label.trim()) return mc.label.trim();
    return /^[A-Za-z][A-Za-z.'-]*\s+\S/.test(n) ? n.split(/\s+/)[0] : n;
  }
  // The script's language follows its content: mostly Latin letters means an English script.
  function isEnglish(state) {
    var s = [state.event].concat(state.blocks.map(function (b) { return b.text; })).join("");
    var cjk = 0, latin = 0;
    for (var ch of s) { if (isWide(ch)) cjk++; else if (/[A-Za-z]/.test(ch)) latin++; }
    return latin > 0 && latin > cjk * 3;
  }
  function named(state) { return state.mcs.filter(function (m) { return (m.name || "").trim(); }); }

  // The name is printed unless the same MC spoke last and no stage direction came between
  // (an award list does not break the run), as in the CA Script Template.
  function speakers(state) {
    var ids = named(state).map(function (m) { return m.id; });
    var out = [], last = null, broken = true;
    state.blocks.forEach(function (b) {
      if (!lines(b.text).length) { out.push(null); return; }
      if (b.type === "line") {
        var id = ids.indexOf(b.mc) >= 0 ? b.mc : (ids.length === 1 ? ids[0] : (b.mc === "cont" ? last : null));
        out.push({ mc: id, show: !(id && !broken && last === id) });
        last = id; broken = false;
      } else {
        out.push(null);
        if (b.type === "cue") broken = true;
      }
    });
    return out;
  }

  function awardRows(text) {
    var out = [], last = null;
    lines(text).forEach(function (l) {
      var m = /^(\S+)\s+(.+)$/.exec(l);
      var c = m ? cls(m[1]) : "", name = m ? m[2].trim() : l;
      out.push({ cls: c === last ? "" : c, name: name });
      last = c;
    });
    return out;
  }

  function describe(state) {
    var en = isEnglish(state);
    var colon = en ? ":" : "：";
    var mcs = named(state);
    var byId = {};
    state.mcs.forEach(function (m) { byId[m.id] = m; });
    var date = yymmdd(state.date, "/");
    var title = [date || "YY/MM/DD", state.event.trim() || (en ? "Event" : "活動名稱"), (en ? "Script" : "講稿")].join(en ? " | " : "｜");
    var heading = mcs.map(function (m) { return (cls(m.cls) + " " + m.name.trim()).trim(); }).join("．");
    var labelWidth = 0;
    mcs.forEach(function (m) { labelWidth = Math.max(labelWidth, twips(mcLabel(m) + colon)); });
    var indent = Math.max(1200, Math.ceil((labelWidth + 200) / 100) * 100);
    var filename = [state.event.trim() || "未命名活動", yymmdd(state.date, "") || "YYMMDD", "講稿"].join(" ") + ".docx";

    var sp = speakers(state);
    var problems = [];
    if (!state.event.trim()) problems.push({ msg: "未填寫活動名稱", target: "event" });
    if (!date) problems.push({ msg: "未選擇日期", target: "date" });
    if (!mcs.length) problems.push({ msg: "未填寫司儀姓名", target: "mc" });
    if (!state.blocks.length) problems.push({ msg: "未有內容", target: "blocks" });
    state.blocks.forEach(function (b, i) {
      if (!lines(b.text).length) problems.push({ msg: "有段落未有內容", target: "block:" + b.id });
      else if (b.type === "line" && sp[i] && !sp[i].mc) problems.push({ msg: "有段落未選擇司儀", target: "block:" + b.id });
    });
    return { en: en, colon: colon, byId: byId, speakers: sp, title: title, heading: heading, indent: indent, filename: filename, problems: problems };
  }

  // One layout for both outputs: a list of paragraphs with their spacing already decided.
  function layout(state) {
    var d = describe(state);
    var paras = [];
    var blocks = [];
    state.blocks.forEach(function (b, i) { if (lines(b.text).length) blocks.push({ b: b, s: d.speakers[i] }); });
    blocks.forEach(function (item, k) {
      var b = item.b, next = blocks[k + 1];
      // Tight gap when the next block continues the same thought: an award list after its lead-in,
      // or the same MC carrying on without a new name.
      var joins = next && (next.b.type === "award" && b.type === "line" || next.b.type === "line" && next.s && !next.s.show && b.type === "line");
      var endGap = !next ? GAP_BLOCK : joins ? GAP_TIGHT : GAP_BLOCK;
      var keepEnd = !!(next && next.b.type === "award" && b.type === "line");
      var ls = lines(b.text);
      if (b.type === "line") {
        var mc = item.s && d.byId[item.s.mc];
        ls.forEach(function (l, j) {
          var last = j === ls.length - 1;
          paras.push({ kind: "line", label: j === 0 && item.s && item.s.show && mc ? mcLabel(mc) + d.colon : "", text: l,
            after: last ? endGap : GAP_TIGHT, keepNext: last && keepEnd, blockId: b.id });
        });
      } else if (b.type === "cue") {
        ls.forEach(function (l, j) {
          var last = j === ls.length - 1;
          paras.push({ kind: "cue", text: l, after: last ? endGap : GAP_TIGHT, keepNext: !last, blockId: b.id });
        });
      } else {
        var rows = awardRows(b.text);
        rows.forEach(function (r, j) {
          var last = j === rows.length - 1;
          paras.push({ kind: "award", cls: r.cls, name: r.name, after: last ? endGap : GAP_NONE, keepNext: !last && rows.length <= 15, blockId: b.id });
        });
      }
    });
    var gaps = {};
    paras.forEach(function (p) { gaps[p.blockId] = p.after; });
    return { d: d, paras: paras, gaps: gaps };
  }

  function t(text) { return '<w:t xml:space="preserve">' + esc(text) + "</w:t>"; }
  var LABEL_RPR = '<w:rPr><w:rFonts w:ascii="Anthropic Serif Text Medium" w:hAnsi="Anthropic Serif Text Medium"/></w:rPr>';

  function bodyXml(state) {
    var L = layout(state), d = L.d, ind = d.indent, awardTab = ind + 1600;
    function ppr(p, extra) {
      return "<w:pPr>" + (extra.style ? '<w:pStyle w:val="' + extra.style + '"/>' : "") + (p.keepNext ? "<w:keepNext/>" : "") +
        (extra.tabs ? '<w:tabs><w:tab w:val="left" w:pos="' + extra.tabs + '"/></w:tabs>' : "") +
        '<w:spacing w:after="' + p.after + '"/>' + extra.ind + "</w:pPr>";
    }
    var x = "";
    x += '<w:p><w:pPr><w:pStyle w:val="Heading1"/><w:rPr><w:sz w:val="48"/><w:szCs w:val="48"/></w:rPr></w:pPr><w:r><w:rPr><w:sz w:val="48"/><w:szCs w:val="48"/></w:rPr>' + t(d.title) + "</w:r></w:p>";
    x += '<w:p><w:pPr><w:pStyle w:val="Heading3"/><w:spacing w:after="480"/></w:pPr><w:r>' + t(d.heading) + "</w:r></w:p>";
    L.paras.forEach(function (p) {
      if (p.kind === "line" && p.label) {
        x += "<w:p>" + ppr(p, { tabs: ind, ind: '<w:ind w:left="' + ind + '" w:hanging="' + ind + '"/>' }) +
          "<w:r>" + LABEL_RPR + t(p.label) + "</w:r><w:r><w:tab/>" + t(p.text) + "</w:r></w:p>";
      } else if (p.kind === "line") {
        x += "<w:p>" + ppr(p, { ind: '<w:ind w:left="' + ind + '"/>' }) + "<w:r>" + t(p.text) + "</w:r></w:p>";
      } else if (p.kind === "cue") {
        x += "<w:p>" + ppr(p, { style: "Caption", ind: '<w:ind w:left="' + ind + '"/>' }) + "<w:r>" + t(p.text) + "</w:r></w:p>";
      } else {
        x += "<w:p>" + ppr(p, { tabs: awardTab, ind: '<w:ind w:left="' + ind + '"/>' }) +
          (p.cls ? "<w:r>" + t(p.cls) + "</w:r>" : "") + "<w:r><w:tab/>" + t(p.name) + "</w:r></w:p>";
      }
    });
    var em = '<w:rPr><w:rStyle w:val="Emphasis"/><w:sz w:val="28"/><w:szCs w:val="28"/></w:rPr>';
    // {End of Script} sits at the foot of the last page: a frame anchored to the bottom margin.
    x += '<w:p><w:pPr><w:framePr w:wrap="around" w:vAnchor="margin" w:hAnchor="margin" w:xAlign="center" w:yAlign="bottom"/><w:jc w:val="center"/>' + em + "</w:pPr><w:r>" + em + t("{End of Script}") + "</w:r></w:p>";
    return x;
  }

  function composeDocumentXml(templateXml, body) {
    var start = templateXml.indexOf("<w:body>") + "<w:body>".length;
    var sect = templateXml.lastIndexOf("<w:sectPr");
    return templateXml.slice(0, start) + body + templateXml.slice(sect);
  }

  async function buildDocx(JSZipLib, templateBase64, state) {
    var zip = await JSZipLib.loadAsync(templateBase64, { base64: true });
    var tpl = await zip.file("word/document.xml").async("string");
    zip.file("word/document.xml", composeDocumentXml(tpl, bodyXml(state)));
    return zip.generateAsync({ type: "uint8array", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
  }

  return { isEnglish: isEnglish, describe: describe, layout: layout, speakers: speakers, bodyXml: bodyXml, awardRows: awardRows, lines: lines,
    mcLabel: mcLabel, cls: cls, named: named, buildDocx: buildDocx, yymmdd: yymmdd };
})();
if (typeof module !== "undefined") module.exports = ScriptGen;

</script>

    persistLib(); renderList();
    toast(list.length > 1 ? "已刪除 " + list.length + " 份講稿" : "已刪除講稿", false, { label: "復原", fn: function () {
      list.forEach(function (s) { markDeleted(s, false); }); persistLib(); renderList();
    } });
  }
  // Everything a search can match: date, event, MCs and the script's own words.
  function searchText(st) {
    return [ScriptGen.yymmdd(st.date, "/"), st.event].concat(st.mcs.map(function (m) { return (m.cls || "") + (m.name || ""); }))
      .concat(st.blocks.map(function (b) { return b.text || ""; })).join("\n").replace(/\s+/g, "").toLowerCase();
  }
  $("q").addEventListener("input", renderList);
  $("q").addEventListener("keydown", function (e) { if (e.key === "Escape") { $("q").value = ""; renderList(); $("q").blur(); } });
  // Under the heading: how many scripts, and any not yet uploaded while offline.
  function renderStatus() {
    var n = shown().length, waiting = cloud ? lib.scripts.filter(pending).length : 0;
    var parts = [];
    if (waiting && sync.state !== "ok") parts.push(waiting + " 份未上載");
    $("libcount").textContent = parts.join("．"); $("libcount").hidden = !parts.length;
    $("libempty").hidden = n > 0 || (!!cloud && !sync.loaded);
  }
  $("back").onclick = backToList;

  /* Shared scripts. In the published site every member's scripts sit in one database behind the
     page's own server, reached with the CA passcode; each iPad keeps its own copy, so writing works
     offline and uploads later. A write names the version it started from; if someone else saved in
     between, the shared copy stays as they left it and this iPad's version is kept as a separate script. */
  var SPACE_KEY = "mc-scripts-space";
  var cloud = null, sync = { state: "ok", loaded: false, pulling: false, pushing: {}, timer: null };
  function pending(s) { return s.dirty && !(isBlank(s.state) && !s.rev && !s.deleted); }
  function api(path, method, body, code) {
    return fetch(CLOUD.api + path, {
      method: method || "GET", cache: "no-store",
      headers: { "Content-Type": "application/json", "X-Passcode": encodeURIComponent(code || cloud.space) },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j || {} }; });
    });
  }
  function setSync(s) { sync.state = s; if (document.body.getAttribute("data-view") === "list") renderStatus(); }
  function schedulePush() {
    if (!cloud) return;
    clearTimeout(sync.timer); sync.timer = setTimeout(pushAll, 1500);
  }
  function pushAll() { lib.scripts.filter(function (s) { return s.dirty; }).forEach(push); }
  async function push(s) {
    if (!cloud || sync.pushing[s.id]) return;
    if (!pending(s)) { if (s.dirty && !s.rev) s.dirty = false; return; }
    sync.pushing[s.id] = true; var sent = s.edit;
    try {
      var r = await api("/scripts/" + s.id, "PUT", {
        data: s.deleted ? "" : JSON.stringify(s.state), updated: s.updated, deleted: !!s.deleted,
        rev: typeof s.rev === "number" ? s.rev : 0
      });
      if (r.status === 200) {
        s.rev = r.body.rev;
        if (s.edit === sent) s.dirty = false;
        if (s.deleted && !s.dirty) lib.scripts = lib.scripts.filter(function (x) { return x !== s; });
        setSync("ok");
      } else if (r.status === 404) { s.rev = null; }
      else if (r.status === 409) await conflict(s);
      else if (r.status === 403) await checkSpace();
      else setSync("error");
    } catch (e) { setSync("offline"); }
    delete sync.pushing[s.id]; persistLib();
    if (s.dirty && s.edit !== sent) schedulePush();
  }
  async function conflict(s) {
    var mine = s.deleted ? null : { id: uid(), updated: Date.now(), state: JSON.parse(JSON.stringify(s.state)), dirty: true, edit: 1 };
    s.dirty = false; s.deleted = false; s.rev = "stale";
    if (mine) {
      lib.scripts.push(mine);
      if (entry === s) { entry = mine; state = mine.state; lib.open = mine.id; savedJson[mine.id] = JSON.stringify(state); renderAll(); }
      toast("其他人同時修改了此講稿，你的版本已另存一份");
    }
    await pull(true); if (mine) push(mine);
  }
  // Fetches what changed since the last look (everything, the first time).
  async function pull(full) {
    if (!cloud || sync.pulling || !navigator.onLine && sync.loaded) return;
    sync.pulling = true;
    try {
      var r = await api("/scripts?since=" + (full ? 0 : lib.seen || 0));
      if (r.status === 403) { await checkSpace(); return; }
      if (r.status !== 200) throw new Error(r.status);
      (r.body.rows || []).forEach(merge);
      persistLib(); setSync("ok");
    } catch (e) { setSync("offline"); }
    finally {
      sync.pulling = false; sync.loaded = true;
      if (document.body.getAttribute("data-view") === "list") renderList();
      pushAll();
    }
  }
  function merge(d) {
    if (d.rev > (lib.seen || 0)) lib.seen = d.rev;
    var st = null; try { st = JSON.parse(d.data || "null"); } catch (e) {}
    var s = find(d.id), updated = Number(d.updated) || Date.now();
    if (!s) { if (!d.deleted && validState(st)) lib.scripts.push({ id: d.id, updated: updated, state: st, rev: d.rev }); return; }
    if (s.rev === d.rev || s.dirty) return;
    if (d.deleted) {
      lib.scripts = lib.scripts.filter(function (x) { return x !== s; });
      if (entry === s) { entry = null; backToList(); toast("此講稿已被刪除"); }
      return;
    }
    if (!validState(st)) return;
    // Never swap the text while someone is typing in it; the next look picks it up.
    if (entry === s && $("doc").contains(document.activeElement)) return;
    s.state = st; s.updated = updated; s.rev = d.rev;
    if (entry === s) { state = st; savedJson[s.id] = JSON.stringify(st); resetHist(); renderAll(); }
  }
  async function checkSpace() {
    try {
      var r = await api("/join", "POST");
      if (r.status === 403) { try { localStorage.removeItem(SPACE_KEY); } catch (e) {} cloud = null; askSpace("密碼已更改，請重新輸入"); }
      else setSync("error");
    } catch (e) { setSync("offline"); }
  }
  function askSpace(msg) { entry = null; showView("join"); $("joinerr").textContent = msg || ""; }
  async function join(raw) {
    // Any characters; spaces are dropped and case is ignored, because iPad keyboards capitalise.
    var code = String(raw || "").replace(/\s+/g, "").toLowerCase();
    if (code.length < 4 || code.length > 128) { $("joinerr").textContent = "密碼不正確"; return; }
    $("joinerr").textContent = "";
    try {
      var r = await api("/join", "POST", null, code);
      if (r.status !== 200) { $("joinerr").textContent = r.status === 403 ? "密碼不正確" : "無法連線，請再試"; return; }
    } catch (e) { $("joinerr").textContent = "無法連線，請再試"; return; }
    try { localStorage.setItem(SPACE_KEY, code); } catch (e) {}
    startCloud(code); showView("list"); renderList(); updateAdd();
  }
  function startCloud(code) {
    cloud = { space: code }; sync.loaded = false; pull();
  }
  $("joinform").addEventListener("submit", function (e) { e.preventDefault(); join($("code").value); });
  if (CLOUD) {
    setInterval(function () { if (document.visibilityState === "visible") pull(); }, 30000);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") pull(); });
    window.addEventListener("online", function () { pull(); });
  }

  /* Problems: shown after a download attempt */
  function problemNode(target) {
    if (target === "event") return $("event");
    if (target === "date") return $("date-wrap");
    if (target === "mc") return document.querySelector("#mcline input:not(.upper)");
    if (target === "blocks") return $("insert");
    if (target.indexOf("block:") === 0) return $("r-" + target.slice(6));
    return null;
  }
  function markProblems() {
    document.querySelectorAll(".needs").forEach(function (n) { n.classList.remove("needs"); });
    if (!showProblems) return;
    var probs = ScriptGen.describe(state).problems;
    if (!probs.length) { showProblems = false; return; }
    probs.forEach(function (p) { var n = p.target !== "blocks" && problemNode(p.target); if (n) n.classList.add("needs"); });
  }
  function goToProblem() {
    var p = ScriptGen.describe(state).problems[0]; if (!p) return;
    var n = problemNode(p.target); if (!n) return;
    n.scrollIntoView({ block: "center", behavior: "smooth" });
    var f = n.matches("textarea,input") ? n : n.querySelector("textarea,input");
    if (f) f.focus({ preventScroll: true });
  }

  /* Toast */
  var toastEl = null, toastTimer = null;
  function toast(msg, bad, action, onMsg) {
    if (toastEl) toastEl.remove();
    toastEl = el("div", { class: "toast glass" + (bad ? " bad" : "") + (action ? "" : " plain"), role: "status" }, [
      el("span", { class: "msg" + (onMsg ? " link" : ""), text: msg, onclick: onMsg || null }),
      action ? el("button", { type: "button", class: "tb", text: action.label, onclick: function () { hideToast(); action.fn(); } }) : null
    ]);
    document.body.appendChild(toastEl);
    clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, action ? 8000 : 4000);
  }
  function hideToast() { if (toastEl) { toastEl.remove(); toastEl = null; } }

  /* Share the Word file.
     The file is built ahead of time, so the share sheet opens straight from the tap (iPad Safari
     only allows it then). Inside claude.ai the page cannot open the share sheet, so it saves instead. */
  var MIME = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
  var downloads = null, ready = null, buildTimer = null, buildNo = 0;
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function (ns) { downloads = ns; }).catch(function () { downloads = null; });
  }
  function prebuild() {
    ready = null; clearTimeout(buildTimer);
    buildTimer = setTimeout(function () {
      var d = ScriptGen.describe(state); if (d.problems.length) return;
      var no = ++buildNo;
      ScriptGen.buildDocx(JSZip, TEMPLATE_B64, state).then(function (bytes) {
        if (no === buildNo) ready = { file: new File([bytes], d.filename, { type: MIME }), bytes: bytes, name: d.filename };
      });
    }, 500);
  }
  function buildFile(st) {
    var d = ScriptGen.describe(st);
    return ScriptGen.buildDocx(JSZip, TEMPLATE_B64, st).then(function (bytes) { return { file: new File([bytes], d.filename, { type: MIME }), bytes: bytes, name: d.filename }; });
  }
  function saveFile(f) {
    var url = URL.createObjectURL(f.file);
    var a = el("a", { href: url, download: f.name }); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    toast("已下載 " + f.name);
  }
  // Opens the share sheet with a file built in advance, or saves the file where sharing is not possible.
  async function deliver(f, st) {
    if (f && !downloads && navigator.canShare && navigator.canShare({ files: [f.file] })) {
      try { await navigator.share({ files: [f.file] }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    try {
      if (!f) f = await buildFile(st);
      if (downloads) { await downloads.save({ filename: f.name, data: f.bytes.slice(0) }); toast("已儲存 " + f.name); }
      else saveFile(f);
    } catch (e) {
      var code = e && e.code;
      if (code === "declined") toast("已取消");
      else if (code === "rate_limited") toast("儲存視窗仍在開啟", true);
      else toast("未能分享（" + (code || (e && e.message) || "未知原因") + "）", true);
    }
  }
  function showMissing() {
    var d = ScriptGen.describe(state);
    showProblems = true; markProblems();
    toast(d.problems[0].msg + (d.problems.length > 1 ? "，另有 " + (d.problems.length - 1) + " 項" : ""), true, null, goToProblem);
    goToProblem();
  }
  $("share").onclick = function () {
    if (ScriptGen.describe(state).problems.length) { showMissing(); return; }
    deliver(ready, state);
  };

  function renderAll() {
    W = WORDS.yue; PH.line = W.line; PH.cue = W.cue; $("event").placeholder = W.event;
    $("event").value = state.event || ""; fit($("event"));
    $("date").value = state.date || "";
    renderDate(); renderMcs(); renderRows();
  }
  // A link ending in #k=passcode joins in one tap; the passcode is then removed from the address bar.
  var linkCode = /[#&]k=([^&]+)/.exec(location.hash);
  if (linkCode) history.replaceState(null, "", location.pathname + location.search);
  var space = null; try { space = localStorage.getItem(SPACE_KEY); } catch (e) {}
  var last = lib.open && find(lib.open);
  if (CLOUD && !space) { askSpace(); if (linkCode) { $("code").value = decodeURIComponent(linkCode[1]); join($("code").value); } }
  else {
    if (CLOUD) startCloud(space);
    if (last && !last.deleted) openScript(last.id); else { showView("list"); renderList(); updateAdd(); }
  }
})();
</script>

</body>
</html>
